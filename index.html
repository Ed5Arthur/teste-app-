      Escolha a rota e o degrau em que quer entrar. Pode ser o primeiro, o do meio ou o último —
      desde que você cumpra os requisitos dele.
    </div>
    <div style="max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch">
      ${Object.keys(porArv).sort().map(arv => {
        const a = arvDe(arv);
        return `<div class="lbl" style="margin:10px 0 5px;color:var(--ciano)">${esc(a.l[0])} … ${esc(a.l.slice(-1)[0])}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          ${porArv[arv].map(c => `<button class="btn ghost" data-act="anexar-ok" data-id="${c.id}"
            style="flex:0 0 auto;padding:8px 10px;min-height:34px;font-size:10.5px;color:${RARIDADES[c.r].cor}">
            ${esc(nomeCl(c))}</button>`).join('')}
        </div>`;
      }).join('') || '<div class="lbl">Nada para anexar: você já percorre tudo que conhece.</div>'}
    </div></div>`);
}
function abrirEmprestarPericia(){
  limparPericiasCopiadas();
  const cands = Object.keys(PERICIAS).filter(arv => arvDe(arv) && arvorePermitida(arv)
    && !COPIAS_PER()[arv] && nivelPericia(arv) < NIVEL_OFICIO);
  const cheio = periciasCopiadasHoje() >= PER_COPIA_DIA;
  abrirSheet(`<div class="sheet">
    <h3>Perícia emprestada</h3>
    <div class="lbl" style="margin-bottom:12px">${nPerTxt()}</div>
    <div style="max-height:300px;overflow-y:auto;-webkit-overflow-scrolling:touch">
      ${cands.map(arv => `<div style="display:flex;gap:6px;margin-bottom:5px">
        <button class="clopt" data-act="emprestar-ok" data-id="${arv}" style="flex:1;margin:0" ${cheio?'disabled':''}>
          <span>${esc(PERICIAS[arv][0])}</span><i class="rec">hoje</i></button>
        <button class="btn" data-act="fixar-pericia" data-id="${arv}"
          style="flex:0 0 auto;padding:9px 11px;min-height:38px;font-size:10px">Fixar</button>
      </div>`).join('') || '<div class="lbl">Nenhuma perícia disponível para empréstimo.</div>'}
    </div></div>`);
}
const nPerTxt = () => `${periciasCopiadasHoje()} de ${PER_COPIA_DIA} usadas hoje · fixar não conta no limite diário`;

function painelPoder(){
  if(temLeitor()) return '';   // o Leitor tem painel próprio, com todas as habilidades
  const p = poderDaRota();
  if(!p){
    const e = poderEmEspera();
    if(!e) return '';
    return `
    <h2 class="title" id="t-habilidade" style="color:var(--mute)">${esc(e.n)}</h2>
    <div class="panel">
      <div class="lbl" style="line-height:1.7;text-transform:none;letter-spacing:0">
        ${esc(e.d)}<br><br>
        <b style="color:var(--gelo)">Ainda dorme.</b> A habilidade só desperta em
        <b style="color:${RARIDADES[e.falta.r].cor}">${esc(e.falta.nome)}</b> · ${RARIDADES[e.falta.r].n}.
      </div>
    </div>`;
  }
  const disp = p.ok();
  const usado = (state.poderDia && typeof state.poderDia === 'object') ? state.poderDia[p.arv] === hoje() : false;
  const ativo = poderAtivo(p.arv), nv = nivelPericia(p.arv);
  const resta = ativo ? Math.max(0, Math.ceil((buffDoPoder(p.arv).ate - Date.now())/1000)) : 0;
  return `
  <h2 class="title" id="t-habilidade" style="color:var(--ouro)">${esc(p.n)}</h2>
  <div class="panel" style="border-left:2px solid var(--ouro)">
    <div class="lbl" style="line-height:1.7;margin-bottom:10px;text-transform:none;letter-spacing:0">${esc(p.d)}</div>
    <div style="font-size:12.5px;line-height:1.8;margin-bottom:10px">
      ${p.sorteio
        ? `<span style="color:var(--ouro)">Efeito sorteado na hora</span> · ${p.sorteio.length} possíveis, de ${Math.min(...p.sorteio.map(e=>Math.max(...e.bn.map(b=>b.v))))}% a ${Math.max(...p.sorteio.map(e=>Math.max(...e.bn.map(b=>b.v))))}%`
        : p.buffs(nv).map(b => `<span style="color:var(--ouro)">+${b.v}% ${esc(NOME_BN[b.k])}</span>`).join(' · ')}
    </div>
    ${p.passivo ? `<div class="panel" style="background:rgba(4,10,20,.5);margin:0 0 11px">
        <div class="lbl" style="color:var(--ouro);margin-bottom:4px">Sempre ligada</div>
        <div style="font-size:12.5px;line-height:1.6">${esc(p.passivo())}</div>
      </div>` : ''}
    ${p.carga ? `<div class="lbl" style="margin-bottom:10px;text-transform:none;letter-spacing:0">
        Pode invocar a qualquer hora: a força que sai é a carga solar do momento
        (<b class="num" id="tCargaTxt">${Math.round(p.carga()*100)}%</b> agora). Ao meio-dia sai inteira.
      </div>` : ''}
    ${ativo ? (() => { const bs = (state.buffs||[]).filter(b => b.poder && b.arv === p.arv && b.ate > Date.now());
        const nome = (bs.find(b => b.efeito)||{}).efeito;
        return `<div class="panel" style="background:rgba(4,10,20,.55);margin:0 0 10px;border-color:var(--ouro)">
          ${nome ? `<div class="lbl" style="color:var(--ouro);margin-bottom:5px">Saiu: ${esc(nome)}</div>` : ''}
          <div style="font-size:13px;line-height:1.8">${bs.map(b => `+${b.v}% ${esc(NOME_BN[b.k])}`).join('<br>')}</div>
        </div>`; })() : ''}
    ${ativo
      ? `<div class="dq-progress" style="margin-bottom:8px"><i id="tPoderBar" style="width:${Math.round(resta/(p.min*60)*100)}%"></i></div>
         <div class="btn solid full" style="text-align:center">Ativo · <span id="tPoderTxt">${Math.floor(resta/60)}:${String(resta%60).padStart(2,'0')}</span></div>`
      : `<button class="btn ${disp && !usado ?'solid':'ghost'} full" data-act="poder" ${disp && !usado ?'':'disabled'}>
          ${usado ? 'Já usado hoje' : disp ? `Invocar · ${p.min} min` : `Indisponível (${esc(p.janela)})`}</button>`}
  </div>`;
}

function temaLiberavel(id){
  const t = TEMAS[id]; if(!t) return false;
  return CL().arv === t.arv && CL().topo && rankDe(state.hunter.nivel).r === 'M';
}
const temaLiberado = id => (state.temas || []).includes(id);
function checarTemas(){
  if(!state.temas) state.temas = [];
  Object.keys(TEMAS).forEach(id => {
    if(temaLiberado(id) || !temaLiberavel(id)) return;
    state.temas.push(id);
    registrar(`Tema liberado: ${TEMAS[id].n}`, 'rank');
    notificar('rank', TEMAS[id].n,
      `Você chegou ao fim da rota no Rank M.\nA aparência do Sistema é sua agora — ligue e desligue quando quiser, no Status.\nEla não se perde mais.`);
  });
}
/* Liberado é para sempre; VESTIDO exige a classe do fim da rota como principal.
   Trocar de raça ou de classe tira a roupa, não a conquista. */
function temaVestivel(id){
  const t = TEMAS[id]; if(!t) return false;
  return CL().arv === t.arv && CL().topo && classePermitida(CL());
}
const temaAtual = () => {
  /* Enquanto ela estiver acordada, o tema é dela — não há como tirar. */
  if(typeof temLeitor === 'function' && temLeitor() && !state.paredeDorme) return TEMAS.leitor;
  return (state.tema && temaLiberado(state.tema) && temaVestivel(state.tema)) ? TEMAS[state.tema] : null;
};
/* O tema Anomalia corrompe pedaços do texto na tela: o Sistema está quebrado
   e erra as palavras. Só mexe em rótulos decorativos, nunca em dado seu. */
const LIXO = '@#%&$*!?0/\\|<>=+~^';
/* Corrupção com sósias de letra: "Assinatura" vira "@ssin@tur@", não ruído puro.
   Lê como palavra quebrada, que é o efeito que a Anomalia deve dar. */
const SOSIA = {a:'@',A:'@',s:'$',S:'$',e:'3',E:'3',i:'1',I:'1',o:'0',O:'0',
               t:'7',T:'7',c:'(',l:'|',b:'8',g:'9',z:'2'};
function corromper(txt){
  return txt.split('').map(c => {
    if(c === ' ') return c;
    const r = Math.random();
    if(r < 0.22 && SOSIA[c]) return SOSIA[c];          // sósia: a maior parte
    if(r < 0.26) return LIXO[Math.floor(Math.random()*LIXO.length)];   // ruído raro
    return c;
  }).join('');
}
function glitchTela(){
  const t = temaAtual();
  if(!t || !t.glitch) return;
  document.querySelectorAll('h2.title').forEach(el => {
    if(!el.dataset.puro) el.dataset.puro = el.textContent;
    el.textContent = Math.random() < 0.45 ? corromper(el.dataset.puro) : el.dataset.puro;
  });
}
let temaPosto = null;
function aplicarTema(){
  const t = temaAtual(), raiz = document.documentElement, corpo = document.body;
  if(!raiz || !raiz.style || !corpo || !corpo.style) return;
  const marca = t ? t.n : '';
  if(temaPosto === marca) return;   // memória de sessão, nunca salva
  temaPosto = marca;
  const chaves = ['--void','--deep','--glass','--glass-hi','--edge','--ciano','--ciano-deep',
                  '--gelo','--mute','--ouro','--sombra','--ok'];
  chaves.forEach(k => raiz.style.removeProperty(k));
  corpo.style.background = '';
  const est = document.getElementById('temaCss');
  if(est) est.innerHTML = '';
  if(!t) return;
  for(const k in t.vars) raiz.style.setProperty(k, t.vars[k]);
  corpo.style.background = t.fundo;
  corpo.style.backgroundAttachment = 'fixed';
  if(est) est.innerHTML = t.css || '';
}

/* o fogo só aparece se o tema pedir: cada tema traz as próprias cores de chama */

/* Relógio de um segundo: mexe só nos números que correm, sem redesenhar a tela
   (redesenhar a cada segundo tiraria o foco do campo de busca). Quando algo
   expira de verdade, aí sim redesenha uma vez. */
function tique(){
  if(limparBuffs()){ atualizar(); return; }
  try{
    if(document.body && document.body.classList){
      const cl = document.body.classList;
      cl.toggle('solAceso',   typeof poderAtivo === 'function' && !!poderAtivo('orgulho'));
      cl.toggle('foiceAtiva', typeof poderAtivo === 'function' && !!poderAtivo('ceifador'));
    }
  }catch(e){}
  const sol = (typeof forcaSolar === 'function') ? forcaSolar() : null;
  if(sol){
    const pct = Math.round(sol.f*100);
    const m = document.getElementById('solMult'), t = document.getElementById('solTxt'),
          b = document.getElementById('solBar'), hr = document.getElementById('solHora');
    if(m) m.textContent = '×' + fatorSol().toFixed(2);
    if(t) t.textContent = sol.pico ? 'MEIO-DIA · PODER ABSOLUTO' : `força solar em ${pct}%`;
    if(b) b.style.width = pct + '%';
    if(hr) hr.textContent = String(Math.floor(sol.hora)).padStart(2,'0') + ':' + String(Math.round((sol.hora%1)*60)).padStart(2,'0');
  }
  const p = (typeof poderDaRota === 'function') ? poderDaRota() : null;
  if(p && p.carga){
    const t = document.getElementById('tCargaTxt');
    if(t) t.textContent = Math.round(p.carga()*100) + '%';
  }
  if(p && poderAtivo(p.arv)){
    const bf = buffDoPoder(p.arv);
    const resta = Math.max(0, Math.ceil((bf.ate - Date.now())/1000));
    const t = document.getElementById('tPoderTxt'), b = document.getElementById('tPoderBar');
    if(t) t.textContent = Math.floor(resta/60) + ':' + String(resta%60).padStart(2,'0');
    if(b) b.style.width = Math.round(resta/(p.min*60)*100) + '%';
  }
  if(Math.random() < 0.5) glitchTela();
  document.querySelectorAll('[data-pd]').forEach(el => {
    const resta = Math.max(0, Math.ceil((+el.dataset.ate - Date.now())/1000));
    el.textContent = Math.floor(resta/60) + ':' + String(resta%60).padStart(2,'0');
    const bar = document.getElementById('pdBar-' + el.dataset.pd);
    if(bar) bar.style.width = Math.round(resta/(+el.dataset.min*60)*100) + '%';
  });
  document.querySelectorAll('[data-ate]:not([data-pd])').forEach(el => {
    const falta = +el.dataset.ate - Date.now();
    el.textContent = falta <= 0 ? 'acabou' : tempoCurto(falta);
  });
}
const tempoCurto = ms => {
  const s = Math.ceil(ms/1000);
  if(s >= 3600) return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'min';
  if(s >= 60) return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  return s + 's';
};
setInterval(tique, 1000);

/* Cartão de uma perícia só, reaproveitado pelas duas da classe dela. */
function cartaoPericia(arv, arq){
  const o = perObj(arv) || {n:nivelPericia(arv), xp:0};
  /* perícia ainda não treinada vale 1, senão o estágio some e a barra vira NaN */
  const n = Math.max(1, o.n || 1), est = estagioPericia(n), dentro = ((n-1)%10)+1;
  const nec = Math.max(1, xpHab(n)), max = n >= PER_MAX;
  const pct = max ? 100 : Math.min(100, Math.max(0, (o.xp||0)/nec*100));
  const proxEst = est < 4 ? nomeEstagio(arv, est+1) : null;
  const faltaEst = est < 4 ? ((est+1)*10 - n) : 0;
  const cor = arv === 'escrita' ? 'var(--ouro)' : 'var(--ciano)';
  return `
  <div class="panel" style="margin-bottom:9px">
    <div class="item" style="margin-bottom:9px">
      <div class="body">
        <strong style="color:${cor}">${esc(nomeEstagio(arv, est))}</strong>
        <div class="sub">
          <span class="tag" style="color:${cor}">${esc(PERICIAS[arv][0])} · nível ${n} / ${PER_MAX}</span>
          <span>${max ? 'dominada' : `${dentro} / 10 do estágio`}</span>
        </div>
      </div>

function esperaLoja(r){
  if(r.gasta) return 999;
  if(!r.cd || r.cd < 0 || !r.ultimo) return 0;
  return Math.max(0, r.cd - diasEntre(r.ultimo, hoje()));
}
const rotuloCd = r => !r.cd ? 'sempre disponível'
  : r.cd === -1 ? 'só uma vez'
  : r.cd === 1 ? 'uma por dia' : r.cd === 7 ? 'uma por semana'

/* ==================== SOL DO MEIO-DIA ====================
   A rota dos Pecados fica ridiculamente mais forte perto das 12h.
   Uma vez por dia, dentro da janela, você acende — e dura cinco minutos. */
const SOL_INI = 11, SOL_FIM = 13;      // janela em que o botão aparece
const SOL_MIN = 5;                      // duração em minutos
const naRota = arv => CLS().some(c => c.arv === arv);

/* ==================== CÓPIA (rota Mímica, Meio-Dragão) ====================
   Não é multiclasse: não custa multiplicador de XP e não é permanente.
   Você espelha os bônus de uma classe que já entendeu, por alguns dias.
   Quanto mais rara a classe, menos tempo dura. No topo da rota, um slot fixo. */
const temMimica = () => CLS().some(c => c.arv === 'mimica');
const nivelMimica = () => nivelPericia('mimica');
const podeCopiar = () => temMimica() && nivelMimica() >= 5;
const slotPermanente = () => CLS().some(c => c.arv === 'mimica' && c.i >= 6);
function diasCopia(c){
  const base = 1 + Math.floor(nivelMimica() / 8);      // até 7 dias com Mímica no máximo
  const peso = Math.max(1, c.r - 2);                   // classe rara dura menos
  return Math.max(1, Math.round(base * 3 / peso));
}
/* A cópia é um poder da Mímica, não um troféu: sem ela equipada, o espelho apaga.
   A permanente exige a Mímica como classe PRINCIPAL. */
const copiaValida = () => {
  const cp = state.copia; if(!cp) return false;
  const c = CLASSES[cp.id];
  if(!c || !classePermitida(c)) return false;
  if(CLS().some(x => x.arv === c.arv)) return false;   // entrou na rota: o espelho perde sentido
  if(cp.fixa) return CL().arv === 'mimica';
  return temMimica();
};
const copiaAtiva = () => {
  const cp = state.copia;
  if(!cp || !copiaValida()) return null;
  if(!cp.fixa && Date.now() > cp.ate){ state.copia = null; return null; }
  return CLASSES[cp.id] || null;
};
const copiaDormente = () => (state.copia && !copiaValida()) ? CLASSES[state.copia.id] : null;
function copiarClasse(id, fixar){
  const c = CLASSES[id];
  if(!c || !podeCopiar()) return;
  if(CLS().some(x => x.arv === c.arv)){ toast('Você já anda nessa rota — espelho é para o que falta', 'bad'); return; }
  if(!classePermitida(c)){ toast('Sangue de outra origem não se copia', 'bad'); return; }
  const dias = diasCopia(c);
  state.copia = fixar
    ? {id, fixa:true}
    : {id, ate: Date.now() + dias * 86400000, dias};
  registrar(`Cópia ${fixar?'fixada':'ativada'}: ${c.nome}`, 'rank');
  fecharForm();
  notificar('rank', fixar ? 'Cópia permanente' : 'Poder copiado',
    fixar ? `${c.nome} foi absorvida de vez.\nO Coração Roubado só guarda uma — esta fica até você trocar.`
          : `${c.nome} espelhada por ${dias} ${dias===1?'dia':'dias'}.\nCompatibilidade decidida por Mímica nível ${nivelMimica()} contra uma classe ${RARIDADES[c.r].n}.`);
  atualizar();
}
function abrirCopia(){
  if(!podeCopiar()){ toast('Mímica precisa estar no nível 5', 'bad'); return; }
  /* espelho serve para o que você NÃO tem: nada de copiar a própria rota,
     nem qualquer estágio de uma árvore em que você já está. */
  const minhas = new Set(CLS().map(x => x.arv));
  const cands = Object.values(CLASSES).filter(c => c.arv !== 'nenhuma' && c.arv !== 'mimica'
    && !minhas.has(c.arv) && revelada(c) && classePermitida(c)).sort((a,b) => b.r - a.r);
  const atual = copiaAtiva();
  abrirSheet(`<div class="sheet">
    <h3>Espelhar poder</h3>
    <div class="lbl" style="line-height:1.7;margin-bottom:12px;text-transform:none;letter-spacing:0">
      Só dá para copiar o que você já entendeu: classe descoberta e aberta à sua origem.
      A duração cai conforme a raridade e sobe com Mímica, hoje no nível ${nivelMimica()}.
      ${slotPermanente() ? '<br><b style="color:var(--ouro)">Coração Roubado ativo: você pode fixar uma cópia para sempre.</b>' : ''}
    </div>
    ${atual ? `<div class="panel warn" style="margin-bottom:12px">
      <div class="lbl" style="color:var(--sombra)">Copiando agora</div>
      <div style="font-size:14px;margin:4px 0">${esc(atual.nome)} ${state.copia.fixa ? '· permanente' : `· ${Math.max(0, Math.ceil((state.copia.ate - Date.now())/86400000))} dia(s) restantes`}</div>
      <button class="btn bad full" data-act="soltar-copia">Soltar a cópia</button></div>` : ''}
    <div style="max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch">
      ${cands.slice(0,100).map(c => `<div style="display:flex;gap:6px;align-items:center;margin-bottom:5px">
        <button class="clopt" data-act="copiar" data-id="${c.id}" style="flex:1;margin:0">
          <span style="color:${RARIDADES[c.r].cor}">${esc(c.nome)}</span>
          <i class="rec">${diasCopia(c)}d</i></button>
        ${slotPermanente() ? `<button class="btn" data-act="fixar-copia" data-id="${c.id}"
          style="flex:0 0 auto;padding:9px 11px;min-height:38px;font-size:10px">Fixar</button>` : ''}
      </div>`).join('')}
    </div></div>`);
}
function painelSol(){
  const s = forcaSolar(); if(!s) return '';
  const pct = Math.round(s.f * 100), mult = fatorSol();
  /* ids abaixo são atualizados de segundo em segundo por tique(), sem redesenhar a tela */
  const hh = String(Math.floor(s.hora)).padStart(2,'0') + ':' + String(Math.round((s.hora%1)*60)).padStart(2,'0');
  const cor = s.pico ? 'var(--ouro)' : s.f > .5 ? '#FF9A3C' : s.f > .15 ? 'var(--ciano)' : 'var(--mute)';

    </div>
  </div>`;
}
function painelCopia(){
  const dorm = copiaDormente();
  if(dorm) return `
  <h2 class="title">Mímica</h2>
  <div class="panel warn">

            : `Mímica precisa chegar ao nível 5 para espelhar. Hoje: ${nv}.`}</div>`}
    <button class="btn ${podeCopiar()?'solid':'ghost'} full" data-act="abrir-copia" ${podeCopiar()?'':'disabled'}>
      ${atual ? 'Trocar o que está copiado' : 'Espelhar um poder'}</button>
  </div>`;
}

/* ---------- multiclasse ---------- */
/* Multiclasse não é de graça: ou você já levou uma classe até Lendário,
   ou gasta um Livro de Troca de Classe para forçar a abertura. */
const multiLiberada = () => state.multi === true || CLS().some(c => c.r >= 6) || (state.maiorGrau||0) >= 6;
const podeAbsorver = c => c.arv !== 'nenhuma' && classePermitida(c) && multiLiberada()
  && !CLS().some(x => x.arv === c.arv)
  && CLS().filter(x => x.arv !== 'nenhuma').length < MAX_CLASSES;
const custoAbsorver = c => Math.round(custoClasse(c, 1) * 1.6);
function absorverClasse(id){
  id = retomarEm(id);
  const c = CLASSES[id];
  if(!podeAbsorver(c)) { toast('Não dá para absorver esta classe', 'bad'); return; }
  if(!state.admin && !elegivel(c, 1)) { toast('Requisitos incompletos', 'bad'); return; }
  if(!state.admin && precisaProva(c)) { toast('Esta classe exige provação', 'bad'); return; }
  const custo = state.admin ? 0 : custoAbsorver(c);
  if(state.hunter.coins < custo) { toast('Coins insuficientes', 'bad'); return; }
  state.hunter.coins -= custo;
  if(state.hunter.classe === 'nenhuma:0') state.hunter.classe = id;
  else (state.hunter.extras = state.hunter.extras || []).push(id);
  marcarTida(id);
  registrar(`Classe absorvida: ${c.nome} · agora com ${nClasses()} classes`, 'rank');
  notificar('rank', 'Multiclasse',
    `${c.nome} foi absorvida.\nVocê carrega ${nClasses()} classes: os bônus somam, mas cada nível agora custa ${nClasses()}× mais XP\ne o XP de perícia se divide entre todas.`);
  fecharForm(); atualizar();
}
function largarClasse(id){
  state.hunter.extras = (state.hunter.extras || []).filter(x => x !== id);
  registrar(`Classe abandonada: ${CLASSES[id].nome}`, 'sys');
  toast('Classe abandonada'); fecharForm(); atualizar();
}
function painelMulti(){
  if(temLeitor()) return '';   // ela devora; não existe dividir com mais ninguém
  const extras = (state.hunter.extras || []).map(id => CLASSES[id]).filter(Boolean);
  const n = nClasses(), liberada = multiLiberada();
  return `
  <h2 class="title" id="t-multi">Multiclasse · ${n}/${MAX_CLASSES}</h2>
  <div class="panel">
    <div class="lbl" style="line-height:1.7;text-transform:none;letter-spacing:0;margin-bottom:${extras.length?'11px':'0'}">
      ${!liberada
        ? `<b style="color:var(--perigo)">Bloqueada.</b> Multiclasse abre quando você levar uma classe até
           <b style="color:${RARIDADES[6].cor}">Lendário</b> — ou gastando um Livro de Troca de Classe na Bolsa.
           Maior grau alcançado até agora: <b style="color:var(--gelo)">${RARIDADES[Math.max(1, state.maiorGrau||CL().r)].n}</b>.`
        : n > 1
          ? `Você carrega <b style="color:var(--gelo)">${n} classes</b> e pode evoluir em qualquer uma das rotas.
             Cada nível custa <b style="color:var(--perigo)">${n}× mais XP</b> e o XP de perícia é dividido entre ${n} perícias.`
          : `<b style="color:var(--ok)">Liberada.</b> Absorva outra classe pelo Salão — ela vem com a rota inteira,
             e você passa a evoluir nos dois caminhos. Cada classe extra multiplica o XP por nível.`}
    </div>
    ${extras.map(c => {
      const prox = CLASSES[c.arv+':'+(c.i+1)];
      const ok = prox && elegivel(prox, .7);
      return `<div style="padding:9px 0;border-top:1px solid rgba(120,170,210,.1)">
        <div class="item">
          <div class="body">
            <strong style="color:${RARIDADES[c.r].cor}">${esc(c.nome)}</strong>
            <div class="sub"><span class="tag" style="color:${RARIDADES[c.r].cor}">${RARIDADES[c.r].n}</span>
              <span>${esc(nomePericia(c.arv))}</span>
              <span>${c.i+1}/${arvDe(c.arv).l.length} da rota</span></div>
          </div>
          <button class="icon-btn" data-act="largar" data-id="${c.id}" aria-label="Abandonar">✕</button>
        </div>
        ${prox ? (() => { const req = requisitos(prox,.7);
          return `<div class="lbl" style="margin:8px 0 5px;color:${RARIDADES[prox.r].cor}">
              Próximo: ${esc(nomeCl(prox))} · ${RARIDADES[prox.r].n}</div>
            <div class="dq-progress" style="margin-bottom:7px"><i style="width:${Math.round(progresso(prox,.7)*100)}%"></i></div>
            <div style="margin-bottom:8px">${linhaReq(req)}</div>
            ${precisaProva(prox) && ok ? `<div class="lbl" style="margin-bottom:7px;color:var(--sombra);
                text-transform:none;letter-spacing:0">Grau ${RARIDADES[prox.r].n} exige provação — aceite pelo Salão das Classes.</div>` : ''}
            <button class="btn ${ok?'solid':'ghost'} full" data-act="evoluir-extra" data-id="${c.id}" ${ok?'':'disabled'}>
              ${ok ? `Evoluir · ${fmt(state.admin?0:custoClasse(prox,.7))} ⬢` : 'Requisitos incompletos'}</button>`;
        })() : `<div class="lbl" style="margin-top:6px;color:var(--ouro)">Fim da rota — nada acima disto.</div>`}
      </div>`;
    }).join('')}
  </div>`;
}
function evoluirExtra(idAtual){
  const c = CLASSES[idAtual], prox = CLASSES[c.arv+':'+(c.i+1)];
  if(!prox) return;
  if(!classePermitida(prox)){ toast(motivoClasse(prox), 'bad'); return; }
  if(!elegivel(prox, .7)){ toast('Requisitos incompletos', 'bad'); return; }
  const custo = state.admin ? 0 : custoClasse(prox, .7);
  if(state.hunter.coins < custo){ toast('Coins insuficientes', 'bad'); return; }
  state.hunter.coins -= custo;
  state.hunter.extras = (state.hunter.extras||[]).map(x => x === idAtual ? prox.id : x);
  marcarTida(prox.id);
  state.maiorGrau = Math.max(state.maiorGrau || 0, prox.r);
  if(!(state.desc||[]).includes(prox.id)) (state.desc = state.desc||[]).push(prox.id);
  registrar(`Classe secundária evoluiu: ${c.nome} → ${prox.nome}`, 'rank');
  notificar('rank', prox.nome,
    `Sua rota secundária avançou.\n${c.nome} → ${prox.nome} · ${RARIDADES[prox.r].n}.\nA classe principal segue a mesma.`);
  atualizar();
}

/* ---------- consumíveis do Sistema ---------- */
const CONS = () => state.consumiveis || (state.consumiveis = {livro:0, tomo:0});
function darConsumivel(k, q=1, silencioso){
  CONS()[k] = (CONS()[k] || 0) + q;
  const nome = k === 'livro' ? 'Livro de Troca de Classe' : 'Tomo de Conhecimento';
  registrar(`Item raro: ${nome}`, 'rank');

      ? 'Um livro que reescreve o que você é.\nPermite assumir qualquer classe já descoberta, ignorando requisitos e provação.\nO preço é sempre o mesmo: nível 1, Rank E.'
      : 'Um tomo com o registro de uma classe que você nunca viu.\nUse na Bolsa para revelar uma classe desconhecida de grau Épico ou acima.');
}

function usarTomo(){
  if(!CONS().tomo) return;
  if(!state.desc) state.desc = [];
  const cands = Object.values(CLASSES).filter(c => c.arv !== 'nenhuma' && c.r >= 4
    && !state.desc.includes(c.id) && classePermitida(c));
  if(!cands.length){ toast('Você já conhece tudo que este tomo alcança', 'bad'); return; }
  CONS().tomo--;
  const c = cands[Math.floor(Math.random() * cands.length)];
  state.desc.push(c.id);
  registrar(`Tomo revelou: ${c.nome}`, 'rank');
  ping(1180,.2); atualizar();
  fichaClasse(c, 'O Tomo revelou esta classe', true);
}

/* ---------- render: BOLSA ---------- */

/* cada ofício tem o seu próprio verbo e a sua própria ação.
   Quem não é de Produção não fabrica: coleta material ou encomenda de quem fabrica. */
/* Nível mínimo de perícia para abrir a bancada. Ter a classe não basta: tem que ter treinado. */
const NIVEL_OFICIO = 5;
/* Cada ofício faz só o que sabe fazer. Ferreiro não escava, alfaiate não forja espada. */
const FORJA = {
  ferreiro:[['Espada','arma'],['Machado','arma'],['Lança','arma'],['Martelo','arma'],['Adaga','arma'],['Foice','arma'],
            ['Elmo','elmo'],['Peitoral','peitoral'],['Cota de Malha','peitoral'],['Manoplas','luvas'],['Grevas','botas']],
  alfaiate:[['Túnica','peitoral'],['Manto','peitoral'],['Capuz','elmo'],['Calça Acolchoada','calca'],

};
FORJA.forjanao = FORJA.ferreiro; FORJA.inventor = FORJA.artifice; FORJA.nucleo = FORJA.espadamec;
const OFICIOS = {
  ferreiro:  {v:'Forjar',    ac:'equip'},  forjanao: {v:'Forjar',    ac:'equip'},
  alfaiate:  {v:'Costurar',  ac:'equip'},  joalheiro:{v:'Lapidar',   ac:'equip'},
  carpinteiro:{v:'Entalhar', ac:'equip'},  escultor: {v:'Esculpir',  ac:'equip'},
  artifice:  {v:'Montar',    ac:'equip'},  inventor: {v:'Montar',    ac:'equip'},
  nucleo:    {v:'Calibrar',  ac:'equip'},  espadamec:{v:'Calibrar',  ac:'equip'},
  minerador: {v:'Escavar',   ac:'coleta', m:['metal','gema']},
  lenhador:  {v:'Derrubar',  ac:'coleta', m:['madeira']},
  pescador:  {v:'Pescar',    ac:'coleta', m:['osso','essencia']},
  fazendeiro:{v:'Colher',    ac:'coleta', m:['tecido','madeira']},
  navegador: {v:'Dragar',    ac:'coleta', m:['osso','gema']},
  abissal:   {v:'Mergulhar', ac:'coleta', m:['gema','essencia']},
  mercador:  {v:'Encomendar',ac:'coleta', m:['metal','tecido','gema']}
};
/* Perícia aprendida não se perde: quem treinou Ferraria continua com a bancada,
   mesmo tendo trocado de classe. A classe ativa só muda o bônus da roleta. */
/* Qualificado = tem AQUELA perícia, naquele nível. Nada de herdar oficina de outra. */
/* perícia de uma rota que a sua origem não alcança fica guardada, mas não abre bancada
   nem dá bônus: o corpo mudou, a mão esqueceu. */
/* Escrita não tem árvore própria: é a segunda perícia dela. */
const PSEUDO_PER = ['escrita'];
const pericaAtiva = arv => PSEUDO_PER.includes(arv) ? temLeitor() : arvorePermitida(arv);
const temOficio = arv => pericaAtiva(arv)
  && (nivelPericia(arv) >= NIVEL_OFICIO
      || (typeof temPericiaCopiada === 'function' && temPericiaCopiada(arv)));
const temPericia = arv => temOficio(arv);
function oficinas(tipo){
  return Object.keys(OFICIOS)
    .filter(arv => OFICIOS[arv].ac === tipo && temOficio(arv))
    .map(arv => ({...OFICIOS[arv], arv, ativa: CLS().some(c => c.arv === arv), nv: nivelPericia(arv)}))
    .sort((a,b) => (b.ativa - a.ativa) || (b.nv - a.nv));
}
function oficioAtivo(tipo){ return oficinas(tipo)[0] || null; }
/* o que falta para abrir a bancada da classe atual, se for uma classe de ofício */
function oficioEmFormacao(){
  for(const c of CLS()){
    if(OFICIOS[c.arv] && !temOficio(c.arv))
      return {arv:c.arv, v:OFICIOS[c.arv].v, nv:nivelPericia(c.arv), falta:NIVEL_OFICIO - nivelPericia(c.arv)};
    if(ARV_COZINHA.includes(c.arv) && !temOficio(c.arv))
      return {arv:c.arv, v:'Cozinhar', nv:nivelPericia(c.arv), falta:NIVEL_OFICIO - nivelPericia(c.arv)};
  }
  return null;
}
function coletar(){
  const o = oficioAtivo('coleta'); if(!o) return;
  if(state.coletaDia === hoje()){ toast('Você já coletou hoje', 'bad'); return; }
  state.coletaDia = hoje();
  const q = 2 + Math.floor(Math.random() * 2), achados = [];
  for(let i = 0; i < q; i++){
    const t = o.m[Math.floor(Math.random() * o.m.length)];
    const base = 0.9 + nivelPericia(o.arv) * 0.05 + iRank(state.hunter.nivel) * 0.25;
    const r = Math.max(1, Math.min(7, Math.round(base - 0.6 + Math.random() * 1.6)));
    addMat(t, r, 1); achados.push(nomeMat(t, r));
  }
  ganharPericiaEm(o.arv, xpHab(nivelPericia(o.arv)) * 0.10);
  registrar(`${o.v}: ${achados.join(' · ')}`, 'ganho');
  toast(achados.join(' · '), 'good'); ping(980,.12);
  atualizar();
}

function ligarForja(){
  overlay.querySelectorAll('[data-fj]').forEach(b => b.onclick = () => {
    const a = b.dataset.fj;
    if(a === 'add'){
      if(forja.sel.length >= matsNecessarios()) return;
      const [t,r] = b.dataset.k.split(':');
      forja.sel.push({t, r:+r}); ping(760,.05); telaMateriais();
    }
    else if(a === 'limpar'){ forja.sel = []; telaMateriais(); }
    else if(a === 'tipo'){ forja.modo === 'prato' ? telaPrato() : telaTipo(); }
    else if(a === 'voltar'){ telaMateriais(); }
    else if(a === 'forjar'){ girarRoleta(b.dataset.s, b.dataset.t); }
    else if(a === 'cozinhar'){ girarPrato(+b.dataset.i); }
  });
}
function equiparItem(id){

  const atual = EQUIP()[it.slot];
  if(atual) BOLSA().push(atual);
  EQUIP()[it.slot] = it;
  state.bolsa = BOLSA().filter(x => x.id !== id);
  registrar(`Equipou ${it.nome}`, 'sys');
  toast(`Equipado: ${it.nome}`, 'good'); ping(1040,.12);
  fecharForm(); atualizar();
}

        <time class="num">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</time>
        <span style="color:${cor(l.tipo)}">${esc(l.txt)}</span></div>`;
    }).join('') : `<div class="lbl">Nenhum registro ainda.</div>`}
    </div>
    <button class="btn ghost full" data-act="fechar-sheet" style="margin-top:14px">Fechar</button></div>`);
}

function checarDiaria(){
  const d = state.diaria;
  if(!d.ativa || !d.metas.length) return;
  const completa = d.metas.every(m => m.feito >= m.meta);
  /* duas travas: a marca de paga e a data. Desmarcar e remarcar nunca paga de novo. */
  if(completa && !d.paga && d.pagaDia !== hoje()){
    d.paga = true; d.pagaDia = hoje(); state.totais.diariasOk++;
    const bd = 1 + B('diaria') + EB('diaria');
    ganhar(Math.round(d.xp*bd), Math.round((d.c || d.xp/10)*bd), 'Missão diária concluída');
    tentarDescoberta(.25); evento('diarias', 1); tentarDrop(.12, 2);
    notificar('level', 'Diária concluída', `Todas as tarefas foram cumpridas.\nNenhuma penalidade será aplicada hoje.\n+${fmt(d.xp)} XP.`);
  }
  /* a marca de paga só cai na virada do dia. Desmarcar e remarcar uma tarefa
     não pode pagar de novo — era assim que dava para repetir a recompensa. */
}

function abrirTutorial(){
  if(state.tutAtivo) return;                       // nunca abre duas vezes
  if(fila.length || notifNaTela()){                // espera a fila esvaziar
    state.tutPendente = true; return;
  }
  state.tutPendente = false;
  state.tutPasso = 0; state.tutAtivo = true; renderTut();
}

function alvoDoPasso(i){
  const p = TUTORIAL[i];
  return (p && p.alvo) ? document.querySelector(p.alvo) : null;
}
function posicionarHolofote(){
  if(!state.tutAtivo) return;
  const p = TUTORIAL[state.tutPasso]; if(!p) return;
  const el = alvoDoPasso(state.tutPasso);
  const navH = 66 + 10;
  if(!el){                                   // seção ainda não existe: só escurece
    spot.className = 'on';
    spotHole.style.cssText = 'position:absolute;left:50%;top:50%;width:0;height:0;opacity:0';
    tut.style.top = ''; tut.style.bottom = `calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px)`;
    return;
  }
  /* o recorte cobre o título e o painel logo abaixo dele */
  const irmao = el.nextElementSibling;
  const r1 = el.getBoundingClientRect();
  const r2 = irmao ? irmao.getBoundingClientRect() : r1;
  const top = Math.min(r1.top, r2.top) - 6;
  const bottom = Math.max(r1.bottom, r2.bottom) + 6;
  const left = Math.min(r1.left, r2.left) - 6;
  const right = Math.max(r1.right, r2.right) + 6;
  spot.className = 'on';
  spotHole.style.opacity = '1';
  spotHole.style.left = left + 'px';
  spotHole.style.top = top + 'px';
  spotHole.style.width = (right - left) + 'px';
  spotHole.style.height = (bottom - top) + 'px';

  /* a caixa encosta no elemento, do lado que tiver espaço, sem cobrir o recorte */
  const alturaCard = tut.offsetHeight || 190;
  const vh = window.innerHeight;
  const espacoAbaixo = vh - bottom - navH;
  if(espacoAbaixo >= alturaCard + 10){
    tut.style.top = (bottom + 10) + 'px'; tut.style.bottom = 'auto';
  } else if(top >= alturaCard + 16){
    tut.style.top = (top - alturaCard - 10) + 'px'; tut.style.bottom = 'auto';
  } else {
    tut.style.top = 'auto';
    tut.style.bottom = `calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px)`;
  }
}
function rolarAte(el){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const alvoY = (window.scrollY || 0) + r.top - Math.max(90, window.innerHeight * 0.22);
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try{ window.scrollTo({top:Math.max(0, alvoY), behavior:reduzir ? 'auto' : 'smooth'}); }
  catch(e){ window.scrollTo(0, Math.max(0, alvoY)); }
}
function renderTut(){
  const i = state.tutPasso, passo = TUTORIAL[i];
  if(!passo){ fecharTutorial(); return; }
  state.tutAtivo = true;
  if(passo.aba && passo.aba !== abaAtual) irParaAba(passo.aba);

  tut.className = 'on';
  tut.innerHTML = `<div class="tutcard">
    <div class="tutdots">${TUTORIAL.map((_,k) => `<i class="${k<=i?'on':''}"></i>`).join('')}</div>
    <div class="th"><b>${esc(passo.t)}</b><span class="lbl num">Tutorial ${i+1} / ${TUTORIAL.length}</span></div>
    <div class="td">${esc(passo.d)}</div>
    <div class="tb">
      <button class="btn ghost" data-tut="pular">Pular</button>
      ${i > 0 ? `<button class="btn ghost" data-tut="voltar">Voltar</button>` : ''}
      <button class="btn solid" data-tut="proximo">${i === TUTORIAL.length-1 ? 'Concluir' : 'Próximo'}</button>
    </div>
  </div>`;
  tut.querySelectorAll('[data-tut]').forEach(b => b.onclick = () => {
    const a = b.dataset.tut;
    if(a === 'pular'){ fecharTutorial(); return; }
    if(a === 'voltar'){ state.tutPasso--; ping(520,.05); renderTut(); return; }
    state.tutPasso++; ping(700,.05);
    if(state.tutPasso >= TUTORIAL.length) fecharTutorial(); else renderTut();
  });

  const el = alvoDoPasso(i);
  rolarAte(el);
  setTimeout(() => rolarAte(alvoDoPasso(i)), 90);   // depois do render da aba nova
  posicionarHolofote();
  setTimeout(posicionarHolofote, 120);
  setTimeout(posicionarHolofote, 420);
  if(!tutLigado){
    tutLigado = true;
    window.addEventListener('scroll', posicionarHolofote, {passive:true});
    window.addEventListener('resize', posicionarHolofote);
  }
}

  const raca = RACAS.find(r => r.id === (ob.raca || 'humano'));
  const candidatas = ARVORES.filter(a => a.id !== 'nenhuma' && (a.base || 1) === 1
    && !raca.blq.includes(a.id) && (!a.raca || a.raca === raca.id));
  const notas = candidatas.map(a => {
    const w = AFIN[a.arq] || {};
    let nota = 0, peso = 0;
    for(const k in w){ nota += (perfil[k] || 0) * w[k]; peso += w[k]; }
    nota = peso ? nota/peso : 0;
    nota *= (raca.afin[a.arq] || 1);
    if(raca.fav.includes(a.id)) nota *= 1.25;
    return {a, nota};
  }).sort((x,y) => y.nota - x.nota);
  const topo = notas.slice(0, 3);
  const esc = topo[Math.floor(Math.random() * topo.length)];
  return {arv: esc.a, arq: esc.a.arq, lista: candidatas};
}
function aplicarBackup(txt){
  try{
    const novo = JSON.parse(txt);
    if(!novo || !novo.hunter) throw 0;
    const base = inicial();
    state = Object.assign(base, novo);
    state.hunter = Object.assign(inicial().hunter, novo.hunter);
    state.totais = Object.assign(inicial().totais, novo.totais);
    state.diaria = Object.assign(inicial().diaria, novo.diaria);
    state.despertar = true;
    virarDia(); virarSemana();
    fecharForm(); ob = null;
    toast('Progresso restaurado', 'good'); ping(980,.2);
    atualizar();
    return true;
  }catch(e){ toast('Backup inválido', 'bad'); return false; }
}

      <div id="obLista" style="max-height:340px;overflow-y:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch">
        ${(() => {
          const cartao = (x, exc) => { const a = arvDe(x.arv), topo = CLASSES[x.arv+':'+(a.l.length-1)];

              <div class="cd">${esc(a.d)}</div>
              <div class="cr">Leva a <b>${esc(topo.nome)}</b> · ${RARIDADES[topo.r].n} · perícia ${esc(PERICIAS[x.arv]?PERICIAS[x.arv][0]:'—')}</div>

          /* conta como exclusiva a rota que é da raça E também a rota aberta cujo topo só ela alcança */
          const arvGate = new Set(Object.entries(GATE_CLASSE)
            .filter(([,g]) => g === raca.id).map(([k]) => CLASSES[k].arv));
          const ehExc = x => arvDe(x.arv).raca === raca.id || arvGate.has(x.arv);

function resumoBonusRacaPrevia(r){
  const nomes = {xp:'XP', coin:'Coins', crit:'Crítico', def:'Resistência a penalidade',
                 seq:'Sequência', missao:'Missões', diaria:'Diária'};
  const out = [];
  const st = Object.entries(r.st).filter(([,v]) => v !== 0)
    .map(([k,v]) => `${v>0?'+':'−'}${Math.abs(v)} ${STATS.find(s=>s.k===k).n}`);
  if(st.length) out.push(st.join(' · '));
  Object.keys(nomes).forEach(k => { const v = r.bn[k] || 0;
    if(v) out.push(`${v>0?'+':'−'}${Math.abs(v)}% ${nomes[k]}`); });
  const esc2 = Object.entries(r.esc).map(([k,v]) => `+${v}% ${nomes[k]} por rank`);
  if(esc2.length) out.push(esc2.join(' · '));
  return out;
}

function irOb(acao, i){
  const total = PERGUNTAS.length;
  if(acao === 'iniciar'){
    if(!ob.nome.trim()){ toast('O Sistema precisa de um nome', 'bad'); return; }
    ob.passo = 0; ping(880,.12); renderOb();
  }
  else if(acao === 'arquivo'){ document.getElementById('obArq').click(); }
  else if(acao === 'colar'){ ob.colando = true; renderOb(); }
  else if(acao === 'restaurar'){
    const t = document.getElementById('obTxt');
    if(t && t.value.trim()) aplicarBackup(t.value.trim());
  }
  else if(acao === 'resp'){
    const escolha = PERGUNTAS[ob.passo][1][+i][1];
    ob.hist.push(escolha);
    for(const k in escolha) ob.eixos[k] = (ob.eixos[k] || 0) + escolha[k];
    ob.passo++; ping(560 + ob.passo * 14, .05);
    if(ob.passo === total) ping(760,.16);
    renderOb();
  }
  else if(acao === 'voltar'){
    if(ob.passo > total){ ob.passo = total; ob.rec = null; ob.escolha = null; renderOb(); return; }
    if(ob.passo === total){ ob.passo = total - 1; const u = ob.hist.pop() || {};
      for(const k in u) ob.eixos[k] -= u[k]; renderOb(); return; }
    const ult = ob.hist.pop() || {};
    for(const k in ult) ob.eixos[k] -= ult[k];
    ob.passo--; renderOb();
  }
  else if(acao === 'secreto'){
    ob.toques = (ob.toques||0) + 1;
    if(state.secretas){ toast('Registro oculto já liberado'); return; }
    if(ob.toques >= 3){
      state.secretas = true; ping(1320,.3); setTimeout(()=>ping(1760,.4), 200);
      toast('Registro oculto liberado', 'good'); renderOb();
    } else { ping(420 + ob.toques*160, .06); toast(`…${3-ob.toques}`); }
  }
  else if(acao === 'raca'){ ob.raca = i; ping(700,.08); renderOb(); }
  else if(acao === 'confirmar-raca'){
    if(!ob.raca) return;
    ob.passo = total + 1; ob.rec = null; ob.escolha = null;
    ping(760,.16); setTimeout(()=>ping(1140,.3), 180); renderOb();
  }
  else if(acao === 'pick'){ ob.escolha = i; ping(900,.07); renderOb(); }
  else if(acao === 'refazer'){ abrirDespertar(); }
  else if(acao === 'aceitar'){
    const c = CLASSES[ob.escolha], raca = RACAS.find(r => r.id === ob.raca);
    state.hunter.nome = ob.nome.trim().slice(0,20);
    state.hunter.raca = ob.raca;
    state.hunter.classe = ob.escolha;
    state.hunter.pontos += 5;
    state.perfil = {...ob.eixos};
    state.despertar = true;
    registrar(`Despertar concluído · ${raca.n} · classe inicial: ${c.nome}`, 'rank');
    fecharForm(); ob = null;
    notificar('rank', 'Vínculo estabelecido',
      `O Sistema aceitou ${state.hunter.nome} como jogador.\nOrigem: ${raca.n}.\nClasse inicial: ${c.nome}.\n5 pontos de atributo liberados.\nA recusa não é uma opção.`);
    /* o portal abre ANTES do tutorial, para o tutorial poder apontar para ele */
    virarSemana();
    state.tutPendente = !state.tutorial;
    atualizar();
    /* rede de segurança: se a fila de notificações não disparar, o tutorial começa mesmo assim */
    if(!relogioTut) relogioTut = setInterval(() => {
      garantirFila();
      if(state.tutPendente && !state.tutAtivo && !fila.length && !notifNaTela()) abrirTutorial();
      if(!state.tutPendente){ clearInterval(relogioTut); relogioTut = null; }
    }, 1200);
  }
}


/* ---------- boot ---------- */
(async function(){
  const salvo = await Store.load();
  if(salvo && salvo.hunter){
    state = Object.assign(inicial(), salvo);
    state.hunter = Object.assign(inicial().hunter, salvo.hunter);
    state.diaria = Object.assign(inicial().diaria, salvo.diaria);
    state.totais = Object.assign(inicial().totais, salvo.totais);
    if(!CLASSES[state.hunter.classe]) state.hunter.classe = 'nenhuma:0';
    if(!state.totais.xpCarreira){ let a = state.hunter.xp; for(let l=1; l<state.hunter.nivel; l++) a += xpNecessario(l); state.totais.xpCarreira = a; }
    /* faxina: o bug antigo criava perícia nível 1 sem XP só de olhar. Some com as que
       nunca foram treinadas de verdade e não pertencem a nenhuma classe sua. */
    if(state.pericias){
      const minhas = [state.hunter.classe, ...(state.hunter.extras||[])]
        .map(id => (CLASSES[id]||{}).arv);
      Object.keys(state.pericias).forEach(k => {
        const o = state.pericias[k];
        if(o && o.n <= 1 && !o.xp && !minhas.includes(k)) delete state.pericias[k];
      });
    }
    validarClasses();
    checarSonoParede();
    saudarParede();
    virarDia();
  } else {
    registrar('Sistema inicializado. Um novo jogador foi detectado.');
  }
  checarDescobertas(true);
  if(state.despertar) virarSemana();
  if(fechamentoPendente() && state.despertar) setTimeout(abrirFechamento, 2000);
  checarFeitos();
  render(); salvar();
  setTimeout(() => { const c = document.getElementById('capa'); if(c) c.className = 'sai'; }, 1500);
  if(!state.despertar) setTimeout(abrirDespertar, 2100);
})();
window.addEventListener('focus', () => {
  const antes = state.ultimoDia;
  virarDia();
  if(antes !== state.ultimoDia && fechamentoPendente() && state.despertar) setTimeout(abrirFechamento, 250);
  render();
});

<meta name="description" content="SISTEMA — Despertar · caçador de hábitos em RPG, por Soranzai.">
<title>SISTEMA — Despertar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#04060D;
  --deep:#08101F;
  --glass:rgba(15,30,55,.60);
  --glass-hi:rgba(24,46,80,.72);
  --edge:rgba(78,214,255,.30);
  --ciano:#4ED6FF;
  --ciano-deep:#1C7FA6;
  --gelo:#D8EAFB;
  --mute:#748FAB;
  --sombra:#A96BFF;
  --ouro:#FFC94A;
  --perigo:#FF5C6E;
  --ok:#48E39B;
  --nav-h:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #123055 0%, #060C18 45%, var(--void) 100%);
  background-attachment:fixed;
  color:var(--gelo);
  font-family:'Chakra Petch',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  min-height:100dvh;
  overscroll-behavior-y:none;
}
/* grade holográfica + scanlines */
.grid,.scan{position:fixed;inset:0;pointer-events:none;z-index:1}
.grid{
  background-image:linear-gradient(rgba(78,214,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(78,214,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(100% 70% at 50% 0%,#000 20%,transparent 85%);
}
.scan{
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 3px,rgba(0,0,0,.22) 3px 4px);
  opacity:.45;mix-blend-mode:multiply;
}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(4,8,16,.96) 60%,rgba(4,8,16,0));
  backdrop-filter:blur(8px);
}
.hud-row{display:flex;align-items:center;gap:10px}
.rank-badge svg{width:30px;height:30px;display:block}
.rank-badge{
  width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;
  font-weight:700;font-size:21px;line-height:1;
  border:1px solid currentColor;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:rgba(255,255,255,.04);
}
.hud-name{flex:1;min-width:0}
.hud-name b{display:block;font-size:16px;font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-coins{text-align:right;color:var(--ouro);font-weight:700;font-size:15px;white-space:nowrap}
.xpwrap{margin-top:9px}
.xpbar{position:relative;height:7px;background:rgba(120,170,210,.14);overflow:hidden}
.xpfill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--ciano-deep),var(--ciano));
  box-shadow:0 0 14px rgba(78,214,255,.55);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.xpfill::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 6px,transparent 6px 14px);
  animation:slide 1.1s linear infinite}
@keyframes slide{to{background-position:28px 0}}
.xpmeta{display:flex;justify-content:space-between;margin-top:5px}

/* ---------- layout ---------- */
main{position:relative;z-index:2;padding:4px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px)}
.view{display:none;animation:up .28s ease both}
.view.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2.title{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--ciano);
  margin:20px 0 9px;display:flex;align-items:center;gap:9px;font-weight:600}
h2.title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}

.panel{position:relative;background:var(--glass);border:1px solid var(--edge);
  backdrop-filter:blur(7px);padding:13px;margin-bottom:10px}
.panel::before,.panel::after{content:'';position:absolute;width:9px;height:9px;
  border:1px solid var(--ciano);pointer-events:none;opacity:.85}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel.warn{border-color:rgba(169,107,255,.4);background:rgba(38,20,60,.5)}
.panel.warn::before,.panel.warn::after{border-color:var(--sombra)}

/* ---------- botões ---------- */
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{
  border:0;background:rgba(78,214,255,.14);color:var(--ciano);
  font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  padding:11px 16px;min-height:42px;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:background .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn.solid{background:linear-gradient(135deg,var(--ciano-deep),var(--ciano));color:#03121B}
.btn.ghost{background:rgba(120,170,210,.09);color:var(--mute)}
.btn.bad{background:rgba(255,92,110,.15);color:var(--perigo)}
.btn.full{width:100%;display:block}
.btn:disabled{opacity:.35}
.icon-btn{background:none;border:0;color:var(--mute);font-size:17px;padding:6px 8px;line-height:1}

/* ---------- listas ---------- */
.item{display:flex;gap:11px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.item .body strong{font-weight:600;font-size:15px;display:block;word-break:break-word}
.item .body .sub{font-size:12px;color:var(--mute);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px}
.check{
  width:30px;height:30px;flex:0 0 30px;margin-top:2px;border:1px solid var(--edge);
  background:rgba(255,255,255,.03);display:grid;place-items:center;color:transparent;
  font-size:16px;font-weight:700;transition:.18s}
.check.done{background:var(--ciano);border-color:var(--ciano);color:#03121B;box-shadow:0 0 14px rgba(78,214,255,.5)}
.done-txt{opacity:.42;text-decoration:line-through}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;
  border:1px solid currentColor;font-weight:600}
.reward{color:var(--ciano);font-weight:700;font-size:12px}
.reward .c{color:var(--ouro)}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:26px 12px;border:1px dashed rgba(120,170,210,.2)}

/* ---------- stats ---------- */
.stat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(120,170,210,.1)}
.stat-row:last-child{border:0}
.stat-row .nm{width:96px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stat-row .track{flex:1;height:5px;background:rgba(120,170,210,.13)}
.stat-row .fillbar{height:100%;background:var(--ciano);box-shadow:0 0 9px rgba(78,214,255,.45)}
.stat-row .vl{width:66px;text-align:right;font-weight:700}
.plus{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--ciano);background:rgba(78,214,255,.12);
  color:var(--ciano);font-size:18px;line-height:1;display:grid;place-items:center}
.plus:disabled{opacity:.2;border-color:var(--mute);color:var(--mute)}
.power{text-align:center;padding:6px 0 12px}
.power .v{font-size:40px;font-weight:700;color:#fff;text-shadow:0 0 22px rgba(78,214,255,.65);letter-spacing:.02em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(120,170,210,.14)}
.kpi{background:var(--deep);padding:11px 6px;text-align:center}
.kpi .v{font-size:19px;font-weight:700}

/* ---------- diária ---------- */
.dq{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(120,170,210,.1)}
.dq:last-of-type{border:0}
.dq .nm{flex:1;font-weight:600}
.dq .cnt{font-size:13px;font-weight:700;min-width:74px;text-align:right}
.dq .cnt.full{color:var(--ok)}
.stepper{display:flex;gap:1px}
.stepper button{width:34px;height:34px;border:1px solid var(--edge);background:rgba(255,255,255,.03);
  color:var(--gelo);font-size:16px;line-height:1}
.dq-progress{height:4px;background:rgba(120,170,210,.13);margin:10px 0 2px}
.dq-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--ciano-deep),var(--ciano));transition:width .4s}

/* ---------- modal / notificação ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;
  background:rgba(2,5,12,.82);backdrop-filter:blur(5px)}
.overlay.on{display:grid}
.sheet{width:100%;max-width:420px;max-height:86dvh;overflow-y:auto;background:var(--glass-hi);
  border:1px solid var(--edge);padding:18px;animation:pop .26s cubic-bezier(.2,1.1,.3,1) both;position:relative}
.sheet::before,.sheet::after{content:'';position:absolute;width:12px;height:12px;border:1px solid var(--ciano)}
.sheet::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.sheet::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
@keyframes pop{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:none}}
.sheet h3{margin:0 34px 14px 0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ciano)}
.xsheet{position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(120,170,210,.25);color:var(--gelo);
  font-size:17px;line-height:1;z-index:3}
.xsheet:active{background:rgba(255,92,110,.2);border-color:var(--perigo)}
label.field{display:block;margin-bottom:13px}
label.field span{display:block;margin-bottom:5px}
input,select,textarea{width:100%;background:rgba(4,10,20,.75);border:1px solid rgba(120,170,210,.26);
  color:var(--gelo);font-family:inherit;font-size:16px;padding:11px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ciano);outline-offset:2px}
textarea{min-height:110px;font-family:'JetBrains Mono',monospace;font-size:12px}
.row2{display:flex;gap:9px}
.row2>*{flex:1}

/* notificação do Sistema — o momento */
.notif{
  width:100%;max-width:400px;padding:26px 20px 22px;text-align:center;position:relative;
  background:linear-gradient(180deg,rgba(22,58,96,.94),rgba(8,20,40,.96));
  border:1px solid var(--ciano);
  box-shadow:0 0 60px rgba(78,214,255,.28),inset 0 0 40px rgba(78,214,255,.09);
  clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  animation:notifIn .4s cubic-bezier(.2,1.2,.3,1) both;
}
.notif.pen{background:linear-gradient(180deg,rgba(60,22,80,.95),rgba(18,6,30,.96));border-color:var(--sombra);
  box-shadow:0 0 60px rgba(169,107,255,.3),inset 0 0 40px rgba(169,107,255,.1)}
@keyframes notifIn{from{opacity:0;transform:scale(.86) translateY(14px)}to{opacity:1;transform:none}}
.notif .hd{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ciano);margin-bottom:16px}
.notif.pen .hd{color:var(--sombra)}
.notif .big{font-size:27px;font-weight:700;letter-spacing:.06em;margin:4px 0 10px;color:#fff;
  text-shadow:0 0 26px rgba(78,214,255,.8);text-transform:uppercase}
.notif.pen .big{text-shadow:0 0 26px rgba(169,107,255,.85)}
.notif .tw{min-height:52px;font-size:14px;color:var(--gelo);white-space:pre-line}
.notif .tw::after{content:'▌';animation:blink .7s steps(1) infinite;color:var(--ciano)}
.notif.stop .tw::after{display:none}
@keyframes blink{50%{opacity:0}}
.notif .hint{margin-top:18px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* despertar */
.ob{width:100%;max-width:440px;max-height:92dvh;overflow-y:auto;padding:22px 18px;position:relative;
  background:linear-gradient(180deg,rgba(20,44,76,.95),rgba(6,14,28,.97));border:1px solid var(--ciano);
  box-shadow:0 0 60px rgba(78,214,255,.25),inset 0 0 40px rgba(78,214,255,.06);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  animation:notifIn .35s cubic-bezier(.2,1.1,.3,1) both}
.ob .passo{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ciano);
  margin-bottom:10px;display:flex;justify-content:space-between}
.ob h4{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 16px}
.obprog{height:3px;background:rgba(120,170,210,.14);margin-bottom:16px}
.obprog i{display:block;height:100%;background:var(--ciano);box-shadow:0 0 8px var(--ciano);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);
  border:1px solid rgba(120,170,210,.22);color:var(--gelo);font-family:inherit;font-size:15px;
  padding:13px 14px;margin-bottom:8px;transition:.15s}
.opt:active{background:rgba(78,214,255,.18);border-color:var(--ciano);transform:scale(.99)}
.eixo{display:flex;align-items:center;gap:9px;margin:5px 0}
.eixo .n{width:76px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.eixo .t{flex:1;height:5px;background:rgba(120,170,210,.14)}
.eixo .t i{display:block;height:100%;background:linear-gradient(90deg,var(--ciano-deep),var(--ciano));
  box-shadow:0 0 8px rgba(78,214,255,.4);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.eixo .v{width:30px;text-align:right;font-size:11px;color:var(--mute)}
.racard{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);
  border:1px solid rgba(120,170,210,.2);color:var(--gelo);font-family:inherit;
  padding:11px 12px;margin-bottom:8px;transition:.15s}
.racard.on{background:rgba(78,214,255,.12);border-color:var(--ciano)}
.racard .rc-top{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:4px}
.racard .rc-ico{font-size:17px}
.racard .rc-d{font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:6px}
.racard .rc-b{font-size:11.5px;line-height:1.5}
.clopt{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
  text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(120,170,210,.16);
  color:var(--gelo);font-family:inherit;font-size:14px;padding:10px 12px;margin-bottom:5px}
.clopt.on{background:rgba(78,214,255,.16);border-color:var(--ciano);color:#fff}
.clopt .rec{font-style:normal;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro)}
.clcard{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);
  border:1px solid rgba(120,170,210,.16);color:var(--gelo);font-family:inherit;
  padding:11px 12px;margin-bottom:6px;transition:.15s}
.clcard.on{background:rgba(78,214,255,.15);border-color:var(--ciano)}
.clcard.exc{border-left:2px solid var(--ouro)}
.clcard .cn{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14.5px;font-weight:600}
.clcard .cx{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);font-weight:600;white-space:nowrap}
.clcard .cd{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:4px}
.clcard .cr{font-size:11px;margin-top:5px;color:var(--ciano)}

/* bolsa e forja */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{background:rgba(255,255,255,.03);border:1px solid rgba(120,170,210,.18);padding:9px 5px;
  text-align:center;min-height:70px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  color:var(--gelo);font-family:inherit}
.slot .sn{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.slot .si{font-size:11.5px;font-weight:600;line-height:1.25;word-break:break-word}
.slot.vazio .si{color:var(--mute);opacity:.6}
.matg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.matc{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);
  border:1px solid rgba(120,170,210,.16);padding:8px 9px;text-align:left;color:var(--gelo);font-family:inherit}
.matc.on{border-color:var(--ciano);background:rgba(78,214,255,.14)}
.matc .mn{flex:1;min-width:0;font-size:12px;line-height:1.3}
.matc .mq{font-size:12px;font-weight:700;color:var(--mute)}
.roleta{text-align:center;padding:26px 10px}
.roleta .rv{font-size:30px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;
  min-height:38px;transition:color .1s}
.roleta .rs{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:10px}

/* brilho atrás do losango do Rank: cada tema decide se acende e de que jeito.
   Fica FORA do badge porque o clip-path do losango recortaria qualquer sombra. */
.aura{position:absolute;left:-11px;top:-11px;width:68px;height:68px;border-radius:50%;
  pointer-events:none;z-index:0;opacity:0;transition:opacity .5s ease}
.rank-badge{position:relative;z-index:1}

/* capa de abertura */
#capa{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;background:radial-gradient(120% 80% at 50% 30%,#12325a 0%,#070f1e 55%,#03060d 100%);
  transition:opacity .5s ease, visibility .5s}
#capa.sai{opacity:0;visibility:hidden;pointer-events:none}
#capa .emb{width:112px;height:112px;margin-bottom:20px;animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{0%,100%{filter:drop-shadow(0 0 14px rgba(78,214,255,.45))}50%{filter:drop-shadow(0 0 30px rgba(78,214,255,.85))}}
#capa h1{margin:0;font-size:27px;font-weight:700;letter-spacing:.20em;color:#fff;
  text-shadow:0 0 26px rgba(78,214,255,.7);text-transform:uppercase}
#capa .sub{font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--ciano);margin-top:7px}
#capa .cred{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);text-align:center;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);line-height:2}
#capa .barra{width:130px;height:2px;background:rgba(120,170,210,.2);margin-top:24px;overflow:hidden}
#capa .barra i{display:block;height:100%;width:0;background:var(--ciano);
  box-shadow:0 0 10px var(--ciano);animation:carrega 1.5s ease-out forwards}
@keyframes carrega{to{width:100%}}
@media (prefers-reduced-motion:reduce){#capa .emb{animation:none}#capa .barra i{animation:none;width:100%}}

/* tutorial com holofote */
#spot{position:fixed;inset:0;z-index:54;pointer-events:none;display:none}
#spot.on{display:block}
#spotHole{position:absolute;border:1px solid var(--ciano);
  box-shadow:0 0 0 9999px rgba(3,7,15,.80), 0 0 22px rgba(78,214,255,.45);
  transition:top .34s cubic-bezier(.2,.8,.2,1), left .34s cubic-bezier(.2,.8,.2,1),
             width .34s cubic-bezier(.2,.8,.2,1), height .34s cubic-bezier(.2,.8,.2,1)}
#spotHole::before,#spotHole::after{content:'';position:absolute;width:11px;height:11px;border:2px solid var(--ciano)}
#spotHole::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
#spotHole::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
@media (prefers-reduced-motion:reduce){#spotHole{transition:none}}

/* tutorial */
#tut{position:fixed;left:0;right:0;z-index:56;padding:0 12px;display:none;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
  transition:top .3s cubic-bezier(.2,.8,.2,1), bottom .3s cubic-bezier(.2,.8,.2,1)}
#tut.fixo{top:auto}
#tut .tutcard{max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){#tut{transition:none}}
#tut.on{display:block}
.tutcard{background:linear-gradient(180deg,rgba(20,44,76,.97),rgba(7,16,32,.98));
  border:1px solid var(--ciano);box-shadow:0 -10px 40px rgba(0,0,0,.65),0 0 40px rgba(78,214,255,.16);
  padding:14px 15px 12px;position:relative;
  clip-path:polygon(13px 0,100% 0,100% 100%,0 100%,0 13px);animation:up .3s ease both}
.tutcard .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.tutcard .th b{font-size:15px;font-weight:600;color:var(--ciano);letter-spacing:.02em}
.tutcard .td{font-size:13.5px;line-height:1.6;color:var(--gelo);margin-bottom:12px}
.tutcard .tb{display:flex;gap:7px;align-items:center}
.tutcard .tb .btn{flex:1;min-height:38px;padding:9px 10px;font-size:11px}
.tutdots{display:flex;gap:4px;margin-bottom:9px}
.tutdots i{flex:1;height:2px;background:rgba(120,170,210,.2)}
.tutdots i.on{background:var(--ciano);box-shadow:0 0 6px var(--ciano)}

/* número que sobe ao ganhar */
.flut{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:52;pointer-events:none;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--ciano);
  text-shadow:0 0 18px rgba(78,214,255,.8);animation:sobe 1.15s cubic-bezier(.2,.7,.3,1) forwards}
.flut.perda{color:var(--perigo);text-shadow:0 0 18px rgba(255,92,110,.8)}
.flut.crit{color:var(--ouro);font-size:23px;text-shadow:0 0 22px rgba(255,201,74,.9)}
@keyframes sobe{0%{opacity:0;transform:translate(-50%,10px) scale(.85)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  30%{transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.flut{animation:none;opacity:0}}

/* toasts */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
  z-index:50;display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;padding:0 14px}
.toast{background:rgba(8,22,42,.95);border:1px solid var(--edge);padding:9px 15px;font-size:13px;font-weight:600;
  animation:tin .3s ease both;max-width:100%}
.toast.bad{border-color:rgba(255,92,110,.5);color:var(--perigo)}
.toast.good{border-color:rgba(72,227,155,.5);color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(5,10,20,.96);border-top:1px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
.tab{background:none;border:0;padding:10px 1px;height:var(--nav-h);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--mute);position:relative}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:8px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.tab.on{color:var(--ciano)}
.tab.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--ciano);
  box-shadow:0 0 10px var(--ciano)}
.dot{position:absolute;top:9px;right:calc(50% - 20px);width:7px;height:7px;background:var(--perigo);border-radius:50%}

.logline{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(120,170,210,.09);font-size:13px}
.logline time{color:var(--mute);font-size:11px;flex:0 0 62px;padding-top:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

   ===================================================================== */
const KEY = 'sistema:v1';
/* Versão do app. O botão "Procurar atualização" compara com o versao.json
   publicado ao lado do index e, se houver diferença, limpa o cache do
   service worker e recarrega — é assim que a versão nova chega em quem já instalou. */
const VERSAO = '3.4.0';
async function procurarAtualizacao(){
  if(location.protocol.indexOf('http') !== 0){
    toast('Só funciona no app publicado', 'bad');
    notificar('level', 'Sem servidor',
      'Você está com o arquivo aberto direto do aparelho.\nA procura por atualização só funciona na versão hospedada, que é a instalada pela tela inicial.');
    return;
  }
  toast('Procurando…');
  try{
    const r = await fetch('versao.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const dados = await r.json();
    if(!dados.versao) throw 0;
    if(dados.versao === VERSAO){
      notificar('level', 'Tudo em dia', `Você está na versão ${VERSAO}.\nNão há nada mais novo publicado.`);
      return;
    }
    abrirSheet(`<div class="sheet">
      <h3>Atualização disponível</h3>
      <div class="lbl" style="margin-bottom:10px">Sua versão: <b style="color:var(--gelo)">${esc(VERSAO)}</b>
        · Publicada: <b style="color:var(--ciano)">${esc(dados.versao)}</b></div>
      ${dados.notas ? `<div style="font-size:13px;line-height:1.7;margin-bottom:14px">${esc(dados.notas)}</div>` : ''}
      <div class="lbl" style="margin-bottom:14px;text-transform:none;letter-spacing:0;line-height:1.6">
        Seu progresso não é tocado: ele fica guardado à parte do app. Ainda assim,
        se quiser dormir tranquilo, exporte um backup antes.
      </div>
      <div class="row2">
        <button class="btn ghost" data-act="fechar-sheet">Agora não</button>
        <button class="btn solid" data-act="baixar-atualizacao">Baixar e reiniciar</button>
      </div></div>`);
  }catch(e){
    notificar('penalidade', 'Não deu para checar',
      'Não consegui falar com o servidor.\nPode ser falta de internet ou o arquivo versao.json ainda não estar publicado ao lado do app.');
  }
}
async function aplicarAtualizacao(){
  toast('Baixando…');
  try{
    if('caches' in window){
      const ks = await caches.keys();
      await Promise.all(ks.map(k => caches.delete(k)));
    }
    if(navigator.serviceWorker){
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
    }
  }catch(e){}
  location.reload(true);
}
/* Salva no armazenamento do app quando ele existe; senão cai para o localStorage
   do navegador. É por isso que abrir o arquivo baixado agora também guarda progresso. */
const Store = {
  modo: 'verificando',
  async load(){
    if(typeof window !== 'undefined' && window.storage){
      Store.modo = 'aplicativo';
      try{ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try{
      const v = window.localStorage.getItem(KEY);
      Store.modo = 'navegador';
      return v ? JSON.parse(v) : null;
    }catch(e){ Store.modo = 'memória'; return null; }
  },
  async save(d){
    const txt = JSON.stringify(d);
    if(typeof window !== 'undefined' && window.storage){
      try{ await window.storage.set(KEY, txt); Store.modo = 'aplicativo'; return true; }catch(e){}
    }
    try{ window.localStorage.setItem(KEY, txt); Store.modo = 'navegador'; return true; }
    catch(e){ Store.modo = 'memória'; return false; }
  }
};

const BN_ARV = {
  pecados:     {crit:1.3, xp:.9, coin:-.6},
  libertador:  {xp:1.4, crit:1.1, seq:1.0, def:-8.3},  // no topo a penalidade dobra: é o preço do sol
  ciberpsicose:{xp:1.5, crit:1.0, def:-1.6},          // a máquina roda, você não protege
  mimica:      {xp:.5},                               // a força dela é copiar, não ter
  contrato:    {coin:1.1, loja:.8},
  druida:      {seq:1.0, def:.8},
  barreira:    {def:2.6, seq:.7, crit:-.8},   // aguenta tudo, não corta nada
};
const CLASSES = {};
ARVORES.forEach(a => {
  const arq = ARQ[a.arq], peso = arq.st.reduce((x,y)=>x+y,0), chaves = ['forca','agi','vit','int','per'];
  a.l.forEach((nome,i) => {
    const r = (a.base||1) + i, nula = a.id === 'nenhuma';
    const stats = {}; chaves.forEach((k,j) => stats[k] = nula ? 0 : Math.round(PONTOS_R[r]*arq.st[j]/peso));
    const bn = {}; if(!nula) for(const k in arq.bn) bn[k] = Math.round(arq.bn[k]*BMUL[r]*10)/10;
    /* ajuste próprio da árvore, somado por cima do arquétipo */
    if(!nula && BN_ARV[a.id]) for(const k in BN_ARV[a.id])
      bn[k] = Math.round(((bn[k]||0) + BN_ARV[a.id][k]*BMUL[r])*10)/10;
    const req = {};
    for(const k in REQ_R) req[k] = nula ? 0 : Math.round(REQ_R[k][r] * (arq.rq[k] || 1));
    CLASSES[a.id+':'+i] = {id:a.id+':'+i, arv:a.id, i, nome, r, cat:a.cat, arq:a.arq,
      stats, bn, req, desc:a.d, oculta:r === 7, topo:i === a.l.length-1};
  });
});
const TOTAL_CLASSES = Object.keys(CLASSES).length - 1;

const CL  = () => CLASSES[state.hunter.classe] || CLASSES['nenhuma:0'];
/* multiclasse: a principal define título e rota; todas somam bônus e dividem XP de perícia */
const CLS = () => [state.hunter.classe, ...(state.hunter.extras || [])].map(id => CLASSES[id]).filter(Boolean);
const nClasses = () => Math.max(1, CLS().filter(c => c.arv !== 'nenhuma').length);
const MAX_CLASSES = 5;
const CLS_B = () => { const cp = copiaAtiva();
  const base = [...CLS(), ...(typeof classesCopiadas === 'function' ? classesCopiadas() : [])];
  return cp ? [...base, cp] : base; };
const B  = k => CLS_B().reduce((a,c) =>
  a + (c.bn[k] || 0) * (c.arv === 'orgulho' ? fatorSol() : 1), 0) / 100;
const statsCl = () => { const o = {forca:0,agi:0,vit:0,int:0,per:0};
  CLS_B().forEach(c => { const m = c.arv === 'orgulho' ? fatorSol() : 1;
    for(const k in c.stats) o[k] += Math.round(c.stats[k] * m); }); return o; };
const LVL_A = RANKS.find(r => r.r === 'A').lvl;
const revelada = c => (c.arv === 'leitor')
  ? false
  : (state.admin || c.r <= 1 || (state.desc || []).includes(c.id));

   uma por vez, por sorte, quando você conclui missões, diárias e sobe de nível. */
function checarDescobertas(silencioso){
  if(temLeitor() && !state.paredeDorme && !state.pdDescobriu){
    const prox = CLASSES['leitor:' + (CL().i + 1)];
    if(prox && (state.desc||[]).includes(prox.id)){
      state.pdDescobriu = true;
      notificar('rank', 'A Quarta Parede', narra(fala(PD_DESCOBRE, 'desc')));
    }
  }
  if(!state.desc) state.desc = [];
  const cur = CL(), novas = [];
  Object.values(CLASSES).forEach(c => {
    if(c.arv !== cur.arv || c.r <= 1 || state.desc.includes(c.id)) return;
    if(c.i <= cur.i){ state.desc.push(c.id); return; }
    if(c.i === cur.i + 1 && progresso(c, .7) >= .35){ state.desc.push(c.id); novas.push(c); }
  });
  if(!novas.length || silencioso) return;
  const c = novas[0];
  registrar(`Próximo passo revelado: ${c.nome}`, 'rank');
  notificar('rank', 'Próximo passo revelado',
    `${c.nome} · ${RARIDADES[c.r].n}\nO Sistema reconheceu seu progresso nesta árvore.`);
}
const candidatas = () => Object.values(CLASSES).filter(c =>
  c.arv !== 'nenhuma' && c.r > 1 && !(state.desc||[]).includes(c.id)
  && state.hunter.nivel >= c.req.nivel * .5 && progresso(c) >= .7);
function tentarDescoberta(chance){
  if(!state.desc) state.desc = [];
  if(Math.random() > chance) return;
  const cand = candidatas(); if(!cand.length) return;
  const c = cand[Math.floor(Math.random() * cand.length)];
  state.desc.push(c.id);
  const arv = ARVORES.find(a => a.id === c.arv);
  registrar(`Classe descoberta: ${c.nome} · ${RARIDADES[c.r].n}`, 'rank');
  notificar('rank', 'Classe descoberta',
    `${c.nome}\n${RARIDADES[c.r].n} · ${c.cat}\n\n${arv.d}`);
}
/* a cada novo rank o Sistema entrega uma classe do grau correspondente,
   respeitando a raça — assim nenhuma rota curta fica inalcançável */
const GRAU_DO_RANK = {B:4, A:5, S:6, M:7};
function revelarPorRank(letra){
  const alvo = GRAU_DO_RANK[letra];
  if(!alvo) return null;
  if(!state.desc) state.desc = [];
  const cands = Object.values(CLASSES).filter(c => c.arv !== 'nenhuma' && c.r === alvo
    && !state.desc.includes(c.id) && classePermitida(c));
  if(!cands.length) return null;
  const c = cands[Math.floor(Math.random() * cands.length)];
  state.desc.push(c.id);
  return c;
}

function requisitos(c, fator=1){
  const t = state.totais, h = state.hunter;
  return [
    {n:'XP de carreira', tem:t.xpCarreira, prec:Math.round(c.req.xpTotal*fator)},
    {n:'Coins',          tem:h.coins,      prec:Math.round(c.req.coins*fator)},
    {n:'Missões',        tem:t.missoes,    prec:Math.round(c.req.missoes*fator)},
    {n:'Nível',          tem:h.nivel,      prec:Math.round(c.req.nivel*fator)},
    {n:'Sequência',      tem:t.melhorSeq,  prec:Math.round(c.req.seq*fator)},
    {n:'Diárias',        tem:t.diariasOk,  prec:Math.round(c.req.diarias*fator)},
    {n:PERICIAS[c.arv] ? PERICIAS[c.arv][0] : 'Perícia', tem:nivelPericia(c.arv),
     prec:Math.round((REQ_HAB[Math.min(c.i, REQ_HAB.length-1)]||0)*fator)}
  ].filter(x => x.prec > 1).map(x => (x.ok = x.tem >= x.prec, x));
}
const elegivel = (c,f=1) => classePermitida(c) && (state.admin || requisitos(c,f).every(x => x.ok));
function progresso(c, f=1){
  const r = requisitos(c,f); if(!r.length) return 1;
  return r.reduce((a,x) => a + Math.min(1, x.tem/x.prec), 0) / r.length;
}
const custoClasse = (c,f=1) => Math.round(c.req.coins * f * 0.4);

function resumoBonus(c){
  const l = Object.entries(c.bn).filter(([,v]) => v >= 0.5)
    .map(([k,v]) => `${NOME_BN[k]} +${v}%`);
  const s = Object.entries(c.stats).filter(([,v]) => v > 0)
    .map(([k,v]) => `+${v} ${({forca:'Força',agi:'Agi',vit:'Vit',int:'Int',per:'Per'})[k]}`);
  return {bonus:l, atributos:s};
}

/* Histórico de classes já vestidas: voltar a uma delas não reinicia o personagem.
   Guarda o id exato, então subir de novo na rota ainda custa o de sempre. */
const TIDAS = () => state.tidas || (state.tidas = []);
const jaTeve = id => TIDAS().includes(id);
function marcarTida(id){ if(id && id !== 'nenhuma:0' && !jaTeve(id)) TIDAS().push(id); }
/* O degrau mais alto que você já alcançou numa rota. Caminho andado não se anda de novo:
   voltar a uma rota te devolve onde parou, não ao começo dela. */
function topoAlcancado(arv){
  let melhor = -1;
  TIDAS().forEach(id => { const c = CLASSES[id];
    if(c && c.arv === arv && classePermitida(c) && c.i > melhor) melhor = c.i; });
  return melhor;
}
/* Dado um estágio escolhido, devolve o mais alto entre ele e o que você já teve. */
function retomarEm(id){
  const c = CLASSES[id]; if(!c || c.arv === 'nenhuma') return id;
  const alto = topoAlcancado(c.arv);
  return alto > c.i ? (c.arv + ':' + alto) : id;
}
function aplicarClasse(id, evolucao){
  /* só na troca: evoluir tem que continuar subindo um degrau de cada vez */
  if(!evolucao) id = retomarEm(id);
  if(String(id).indexOf('leitor:') === 0){ perObj('escrita', true); perObj('leitor', true); }
  if(evolucao && String(id).indexOf('leitor:') === 0){
    setTimeout(() => notificar('rank', 'A Quarta Parede', narra(fala(PD_EVOLUI, 'evo'))), 400);
  }
  if(id === 'leitor:6' && state.paredeJaFoi && !temLeitor()){
    setTimeout(() => notificar('rank', 'A Quarta Parede',
      `${narra(fala(PD_VOLTOU,'voltou'))}\n\nEla não estava no seu arquivo. Estava esperando.`), 500);
  }
  if(String(id).indexOf('leitor:') === 0) state.paredeJaFoi = true;
  const c = CLASSES[id], antiga = CL();
  if(!classePermitida(c)){ toast(motivoClasse(c), 'bad'); return; }
  const f = evolucao ? 0.7 : 1;
  const custo = state.admin ? 0 : custoClasse(c, f);
  state.hunter.coins = Math.max(0, state.hunter.coins - custo);
  const conhecida = jaTeve(id);
  state.hunter.classe = id;
  marcarTida(id);
  state.maiorGrau = Math.max(state.maiorGrau || 0, c.r);
  if(c.r >= 6 && !state.multi){
    state.multi = true;
    notificar('rank', 'Multiclasse liberada',
      `Chegar a uma classe Lendária abriu o segundo caminho.\nA partir de agora você pode absorver outras classes no Salão — cada uma traz a rota dela junto.`);
  }
  if(evolucao){
    registrar(`Classe evoluída: ${antiga.nome} → ${c.nome}`, 'rank');
    notificar('rank', c.nome, `A classe evoluiu para ${RARIDADES[c.r].n}.\nOs bônus anteriores foram substituídos pelos novos.\nSeu nível foi mantido.`);
  } else if(conhecida){
    /* caminho já percorrido: o corpo lembra. Voltar não custa nível nem atributo. */
    registrar(`Retomou uma classe conhecida: ${antiga.nome} → ${c.nome}`, 'rank');
    notificar('rank', c.nome,
      `Você já carregou esta classe antes.\nO Sistema reconheceu o registro e devolveu a forma sem cobrar nada:\nnível, rank e atributos ficam como estavam.`);
  } else {
    const investidos = Object.values(state.hunter.stats).reduce((a,b)=>a+b,0) - 50;
    const devolvidos = Math.floor((Math.max(0,investidos) + state.hunter.pontos) * 0.5);
    state.hunter.stats = {forca:10, agi:10, vit:10, int:10, per:10};
    state.hunter.pontos = devolvidos;
    const rkAntes = rankDe(state.hunter.nivel), mereceu = state.hunter.nivel >= LVL_A;
    if(mereceu) state.totais.renascimentos++;
    state.hunter.nivel = 1; state.hunter.xp = 0;
    registrar(`Renascimento: ${antiga.nome} → ${c.nome} · nível reiniciado${mereceu?'':' · sem bônus (rank baixo)'}`, 'rank');
    notificar('rank', c.nome, `Classe adquirida: ${RARIDADES[c.r].n}.\nNível reiniciado em 1, rank de volta a E.\n${devolvidos} pontos de atributo preservados.\n` +
      (mereceu ? `Renascimento reconhecido no rank ${rkAntes.r}: +${state.totais.renascimentos*2}% de XP permanente.`
               : `Sem bônus de renascimento — o Sistema só reconhece quem troca a partir do Rank A. Você saiu no rank ${rkAntes.r}.`));
  }
  fecharForm(); atualizar();
}

/* quem não é de Produção acha material melhor: quem luta traz o raro, quem forja transforma */
function dropar(forca){
  const naoProd = CL().arq !== 'producao';
  const base = 0.2 + forca * 0.42 + (naoProd ? 0.8 : 0) + iRank(state.hunter.nivel) * 0.2;
  const r = Math.max(1, Math.min(7, Math.round(base - 0.7 + Math.random() * 1.7)));
  const t = MAT_TIPOS[Math.floor(Math.random() * MAT_TIPOS.length)];
  addMat(t, r, 1);
  return {t, r};
}
function tentarDrop(chance, forca, quantos=1){
  const achados = [];
  for(let i = 0; i < quantos; i++) if(Math.random() < chance) achados.push(dropar(forca));
  if(!achados.length) return;
  const txt = achados.map(d => nomeMat(d.t, d.r)).join(' · ');
  registrar(`Drop: ${txt}`, 'ganho');
  toast(`Drop: ${txt}`, 'good'); ping(1180, .08);
}

/* ---------- roleta de qualidade ---------- */
/* oficina em uso: a perícia dela é que conta; a classe equipada só decide
   se ainda há bônus cheio de Produção por cima. */
let oficinaAtual = null;
const arvOficina = () => (oficinaAtual && temPericia(oficinaAtual)) ? oficinaAtual : ((oficioAtivo('equip')||{}).arv || CL().arv);
function bonusForja(){
  const arv = arvOficina();
  if(!CLS().some(c => c.arv === arv)) return 0.15;
  const arq = (CLASSES[arv+':0']||{}).arq;
  return arq === 'producao' ? 0.7 : arq === 'tecnica' ? 0.35 : 0;
}
function previsaoForja(mats){
  if(!mats.length) return {min:1, max:1, base:1};
  const media = mats.reduce((a,m) => a + m.r, 0) / mats.length;
  const per = nivelPericia(arvOficina()) * 0.014;
  const st  = (S()[statFoco(CL().arq)] || 0) * 0.008;
  const base = media + per + st + bonusForja();
  return {base, min:Math.max(1, Math.round(base - 1.5)), max:Math.min(7, Math.round(base + 0.9))};
}
/* a roleta puxa para baixo de propósito: equipamento tem que ser conquista, não rotina.
   7% de fiasco total, e mesmo com material bom dá para sair Comum. */
function rolarQualidade(mats){
  const {base} = previsaoForja(mats);
  if(Math.random() < 0.07) return Math.max(1, Math.min(2, Math.round(1 + Math.random() * 1.4)));
  return Math.max(1, Math.min(7, Math.round(base - 1.5 + Math.random() * 2.4)));
}
function xpDaForja(r){
  const arv = arvOficina(), n = nivelPericia(arv) || 1;
  const ativa = CLS().some(c => c.arv === arv);
  return Math.round(xpHab(n) * (0.12 + r * 0.05) * (ativa ? 2 : 0.6));
}

const PER_MAX = 50;
const REQ_HAB = [0, 8, 16, 26, 36, 46, 50];
const xpHab = n => Math.round(150 * Math.pow(n, 1.45) / 10) * 10;
/* ATENÇÃO: ler o nível NUNCA cria a perícia. Só ganhar XP nela cria.
   Era esse efeito colateral que liberava todas as oficinas de uma vez. */
const perObj = (arv, criar) => {
  if(!state.pericias) state.pericias = {};
  if(!state.pericias[arv] && criar) state.pericias[arv] = {n:1, xp:0};
  return state.pericias[arv] || null;
};
function nivelPericia(arv){
  if(!PERICIAS[arv]) return 0;
  const o = state.pericias && state.pericias[arv];
  if(o) return o.n;
  return CLS().some(c => c.arv === arv) ? 1 : 0;   // classe equipada começa em 1, sem gravar
}
const estagioPericia = n => Math.min(4, Math.floor((n-1)/10));
function nomePericia(arv, comEstagio=true){
  const p = PERICIAS[arv]; if(!p) return '—';
  if(!comEstagio) return p[0];
  return `${p[0]} ${PER_EST[p[1]][estagioPericia(nivelPericia(arv))]}`;
}
function nomeEstagio(arv, est){
  const p = PERICIAS[arv]; if(!p) return '—';
  const lista = PER_EST[p[1]];
  const i = Math.min(lista.length - 1, Math.max(0, est));
  return `${p[0]} ${lista[i]}`;
}
/* atributo principal do arquétipo, alvo do bônus de perícia */
const STK = ['forca','agi','vit','int','per'];
const statFoco = arq => STK[ARQ[arq].st.indexOf(Math.max(...ARQ[arq].st))];
function PB(){
  const st = {forca:0,agi:0,vit:0,int:0,per:0}; let xp = 0, coin = 0;
  CLS().forEach(c => {
    if(c.arv === 'nenhuma' || !PERICIAS[c.arv] || !pericaAtiva(c.arv)) return;
    const n = nivelPericia(c.arv);
    st[statFoco(c.arq)] += Math.floor(n/2); xp += n*0.004; coin += n*0.004;
  });
  return {st, xp, coin, n:nivelPericia(CL().arv)};
}
function ganharPericia(xp){
  const ativos = CLS().filter(c => c.arv !== 'nenhuma' && PERICIAS[c.arv]);
  if(!ativos.length || xp <= 0) return;
  ativos.forEach(c => ganharPericiaEm(c.arv, xp / ativos.length));
}
function ganharPericiaEm(arv, xp){
  const c = CLASSES[arv + ':0']; if(!PERICIAS[arv] || xp <= 0) return;
  const o = perObj(arv, true);
  if(o.n >= PER_MAX) return;
  const estAntes = estagioPericia(o.n);
  o.xp += Math.round(xp);
  let subiu = 0;
  while(o.n < PER_MAX && o.xp >= xpHab(o.n)){ o.xp -= xpHab(o.n); o.n++; subiu++; }
  if(!subiu) return;
  const estDepois = estagioPericia(o.n);
  if(estDepois > estAntes || o.n === PER_MAX){
    registrar(`Perícia avançou: ${nomePericia(arv)} (nv ${o.n})`, 'rank');
    notificar('rank', nomePericia(arv),
      o.n === PER_MAX
        ? `${PERICIAS[arv][0]} chegou ao nível máximo.\nNível 50 · nada acima disso nesta perícia.`
        : `Novo estágio de perícia alcançado.\nNível ${o.n} de ${PER_MAX}.\nA evolução desta árvore avançou junto.`);
  } else {
    toast(`${PERICIAS[arv][0]} nv ${o.n}`, 'good');
  }
}

  if(state.leitor && ehDono() && !temLeitor() && CL().arv === 'nenhuma' && RC().id === 'humano'){

  }
  let mudou = false;
  const extras = (state.hunter.extras || []).filter(id => CLASSES[id]);
  const limpos = extras.filter(id => classePermitida(CLASSES[id]));
  if(limpos.length !== extras.length){
    extras.filter(id => !limpos.includes(id)).forEach(id =>
      registrar(`Classe removida por troca de origem: ${CLASSES[id].nome}`, 'perda'));
    state.hunter.extras = limpos; mudou = true;

  if(state.hunter.classe !== 'nenhuma:0' && CLASSES[state.hunter.classe]
     && !classePermitida(CLASSES[state.hunter.classe])){

  if(state.copia && CLASSES[state.copia.id] && !classePermitida(CLASSES[state.copia.id])){

function arvorePermitida(arvId){
  const a = arvDe(arvId); if(!a) return false;
  /* trava dupla: a flag não basta, o nome também tem que ser o dele */
  if(arvId === 'leitor') return state.leitor === true && ehDono() && RC().id === 'humano';
  const r = RC();
  if(a.raca) return a.raca === r.id;

const GATE_CLASSE = {
  'ceifador:5':'serafim',   // Arauto do Fim
  'ceifador:6':'serafim',   // Ceifador
  'espada:5':'humano',      // Santo da Espada
  'dragao:3':'meiodragao',  // Sangue de Dragão — sangue não se aprende
  'dragao:4':'meiodragao',  // Herdeiro do Dragão

};
function classePermitida(c){
  if(c.arv === 'nenhuma') return true;
  if(!arvorePermitida(c.arv)) return false;
  const g = GATE_CLASSE[c.id];
  return !g || RC().id === g;
}

  const g = GATE_CLASSE[c.id];
  if(g && RC().id !== g) return `Só ${RACAS.find(x=>x.id===g).n} alcança`;
  return motivoBloqueio(c.arv);
}
function motivoBloqueio(arvId){
  const a = arvDe(arvId), r = RC();
  if(a && a.raca && a.raca !== r.id) return `Exclusiva de ${RACAS.find(x=>x.id===a.raca).n}`;
  if(r.blq.includes(arvId)) return `Fechada para ${r.n}`;
  const dona = RACAS.find(x => x.ex.includes(arvId));
  return dona ? `Exclusiva de ${dona.n}` : '';
}

/* ==================== O SOL (rota do Orgulho) ====================
   A força acompanha o relógio de verdade: some de madrugada, explode ao meio-dia.
   Entre 11h58 e 12h03 é o pico absoluto. */
function forcaSolar(){
  if(!CLS().some(c => c.arv === 'orgulho')) return null;
  const ag = new Date(), h = ag.getHours() + ag.getMinutes()/60;
  const dist = Math.abs(h - 12);
  const pico = (h >= 11.966 && h <= 12.05);
  let f;
  if(pico) f = 1;
  else if(dist >= 8) f = 0;                       // 4h da manhã: nada
  else f = Math.max(0, Math.pow(1 - dist/8, 2));  // sobe rápido perto do meio-dia
  return {f, pico, hora:h};
}
const MULT_SOL = 2.2;   // no pico, o bônus da classe mais que dobra
function fatorSol(){
  const s = forcaSolar();
  if(!s) return 1;
  return 0.35 + (MULT_SOL - 0.35) * s.f;          // 0.35 de madrugada, 2.2 ao meio-dia
}

const multCoin  = () => Math.max(.3, 1 + S().forca* 0.002 + B('coin') + RB('coin') + PB().coin + EB('coin') + TB('coin'));

function registrar(txt, tipo='sys'){
  state.log.unshift({t:Date.now(), txt, tipo});
  if(state.log.length > 220) state.log.length = 220;

function ganhar(xpBase, coinBase, motivo, permitirCrit=false){
  const crit = permitirCrit && Math.random() < critica();
  const mult = crit ? 2 : 1;
  const xp = Math.round(xpBase * multXP() * mult);
  const co = Math.round(coinBase * multCoin() * mult);
  state.hunter.xp += xp; state.hunter.coins += co; state.totais.xpCarreira += xp;
  registrar(`${motivo} · +${fmt(xp)} XP · +${fmt(co)} Coins${crit?' · CRÍTICO':''}`, 'ganho');
  toast(`+${fmt(xp)} XP · +${fmt(co)} ⬢${crit?' CRÍTICO!':''}`, 'good');
  flutuar(`+${fmt(xp)} XP`, crit ? 'crit' : '');
  if(crit) ping(1320,.14);
  subirNivel();
  ganharPericia(xp * 0.5);
  evento('xp', xp);
}
function perder(xpBase, coinBase, motivo){
  const f = (typeof filtroParede === 'function') ? filtroParede() : {corta:0, chance:0};
  if(f.chance && Math.random() < f.chance){
    /* ela age sozinha: nem foi convidada */
    registrar(`A foice ceifou a cobrança · ${motivo}`, 'rank');
    notificar('rank', 'Ceifado',
      `A punição por "${motivo}" foi cortada antes de encostar.\nO registro continua lá. O dano, não.`);
    return {xp:0, co:0, parede:true};
  }
  const cofre = (typeof escudoCofre === 'function') ? escudoCofre() : {red:0};
  const r = (1 - reducao()) * (1 - f.corta) * (1 - cofre.red);
  const xp = Math.round(xpBase * r), co = Math.round(coinBase * r);
  state.hunter.xp = Math.max(0, state.hunter.xp - xp);
  state.hunter.coins = Math.max(0, state.hunter.coins - co);
  registrar(`${motivo} · −${fmt(xp)} XP · −${fmt(co)} Coins`, 'perda');
  flutuar(`−${fmt(xp)} XP`, 'perda');
  return {xp, co};
}
function subirNivel(){
  let subiu = 0, rankAntes = rankDe(state.hunter.nivel).r;
  while(state.hunter.xp >= xpNecessario(state.hunter.nivel)){
    state.hunter.xp -= xpNecessario(state.hunter.nivel);
    state.hunter.nivel++; state.hunter.pontos += 3; subiu++;
  }
  if(!subiu) return;
  const rk = rankDe(state.hunter.nivel);
  tentarDescoberta(.6);
  if(rk.r !== rankAntes){
    notificar('rank', `${rk.nome}`, `Você superou o limite do rank anterior.\nNível ${state.hunter.nivel} alcançado.\nNovo título: ${tituloDe()}.\n+${subiu*3} pontos de atributo disponíveis.`);
    registrar(`Promovido para ${rk.nome}`, 'rank');
    const liberada = revelarPorRank(rk.r);
    if(liberada){
      registrar(`Rank ${rk.r} liberou o registro de ${liberada.nome}`, 'rank');
      notificar('rank', 'Registro liberado',
        `${liberada.nome} · ${RARIDADES[liberada.r].n}\nO Rank ${rk.r} dá acesso ao registro de uma classe deste grau.\nEla aparece agora no Salão das Classes — falta cumprir os requisitos e a provação.`);
    }
  } else {
    notificar('level', `Nível ${state.hunter.nivel}`, `${subiu>1?`Você subiu ${subiu} níveis de uma vez.`:'Você subiu de nível.'}\n+${subiu*3} pontos de atributo disponíveis.`);
  }
}

let AC;
function ping(freq=880, dur=.18, tipo='triangle'){
  if(!state.som) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.16, AC.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
function flutuar(txt, tipo=''){
  try{
    const el = document.createElement('div');
    el.className = 'flut ' + tipo; el.textContent = txt;

function virarDia(){
  const d = hoje();
  if(state.ultimoDia === d) return;      // abrir o app não é virar o dia
  comentarPD(PD_FECHOU_DIA, 'fechou');
  const faltou = Math.max(1, diasEntre(state.ultimoDia, d));

  const perfeito = state.habitos.length > 0 && state.habitos.every(h => h.feito);
  const completa = state.diaria.ativa && state.diaria.metas.length
    ? state.diaria.metas.every(m => m.feito >= m.meta) : true;

  /* fotografa o dia ANTES de zerar qualquer coisa: é esse retrato que você confirma depois */
  montarFechamento(faltou, perfeito, completa);

  // hábitos: quem não foi marcado perde a sequência (o relatório pode devolver)
  state.habitos.forEach(h => { if(!h.feito) h.seq = 0; h.feito = false; });
  // vícios: um dia a mais limpo por dia passado
  state.vicios.forEach(v => v.limpo += faltou);
  state.diaria.metas.forEach(m => m.feito = 0);
  state.diaria.paga = false; state.diaria.pagaDia = null; state.diaria.comentou = false;
  state.totais.diasVividos = (state.totais.diasVividos||0) + faltou;
  state.ultimoDia = d;
  virarSemana();
}

  perfeitos: {n:'Dias perfeitos seguidos', base:5,  d:'Marque todos os bons hábitos do dia. Um dia incompleto quebra a provação.'},

  missoes:   {n:'Missões concluídas', base:6,       d:'Conclua missões do Quadro enquanto a provação corre.'},
  xp:        {n:'XP acumulado', base:60000,         d:'Acumule XP por qualquer meio até a marca.'},
  sequencia: {n:'Sequência em um hábito', base:12,  d:'Mantenha um mesmo bom hábito vivo por dias seguidos.'}
};
const PROV_MULT = {4:1, 5:1.8, 6:3, 7:5};
const PROV_ARQ = {
  lamina:'perfeitos', bestial:'perfeitos', agil:'diarias', tanque:'diarias', sagrado:'diarias',
  arcano:'xp', mental:'xp', sombrio:'semrecaida',
  producao:'missoes', tecnica:'missoes', mercante:'missoes', natureza:'sequencia'
};
const precisaProva = c => c.r >= 4 && !state.admin && !(state.provadas||[]).includes(c.id);
function provaDe(c){
  const tipo = PROV_ARQ[c.arq] || 'diarias', t = PROV_TIPOS[tipo];
  let alvo = t.base * (PROV_MULT[c.r] || 1);
  alvo = tipo === 'xp' ? Math.round(alvo/1000)*1000 : Math.round(alvo);
  return {tipo, alvo, nome:`Provação de ${c.nome}`, desc:t.d};
}
function iniciarProva(id){
  const c = CLASSES[id], pr = provaDe(c);
  state.prova = {id, tipo:pr.tipo, alvo:pr.alvo, prog:0, inicio:hoje(), quebras:0};
  if(pr.tipo === 'sequencia') state.prova.prog = Math.max(0, ...state.habitos.map(h => h.seq));
  registrar(`Provação iniciada: ${c.nome}`, 'rank');
  notificar('rank', 'Provação emitida',
    `${pr.nome}\n${PROV_TIPOS[pr.tipo].n}: 0 / ${fmt(pr.alvo)}\n${pr.desc}\nA classe só será liberada quando a provação terminar.`);
  fecharForm(); atualizar();
}
function quebrarProva(motivo){
  const p = state.prova; if(!p) return;
  const c = CLASSES[p.id];
  p.prog = 0; p.quebras++;
  registrar(`Provação quebrada (${motivo}): ${c.nome}`, 'perda');
  notificar('penalidade', 'Provação quebrada',
    `${c.nome}\nMotivo: ${motivo}.\nA contagem volta a zero. A provação continua aberta — recomece amanhã.`);
}
function checarProva(){
  const p = state.prova; if(!p || p.prog < p.alvo) return;
  const c = CLASSES[p.id];
  if(!state.provadas) state.provadas = [];
  state.provadas.push(p.id);
  state.totais.provas = (state.totais.provas||0) + 1;
  state.prova = null;
  if(!(state.desc||[]).includes(c.id)) (state.desc = state.desc||[]).push(c.id);
  darConsumivel('tomo', 1, true);
  registrar(`Provação concluída: ${c.nome}`, 'rank');
  notificar('rank', 'Provação concluída',
    `${c.nome} foi liberada.\nA classe agora pode ser assumida no Salão das Classes.\nO Sistema reconhece o esforço.`);
}

/* ==================== FECHAMENTO DO DIA ====================
   O dia não se fecha sozinho às escondidas. Quando você volta, o Sistema mostra
   o que ficou registrado e te dá uma chance de corrigir o que esqueceu de marcar.
   A penalidade só cai depois que você confirma o relatório. */
function montarFechamento(faltou, perfeito, completa){
  state.fechamento = {
    dia: state.ultimoDia,
    dias: faltou,
    perfeito, completa,
    habitos: state.habitos.map(h => ({
      id:h.id, nome:h.nome, feito:h.feito, xp:h.xp, c:h.c, seqAntes:h.seq, marcar:h.feito
    })),
    diaria: (state.diaria.ativa && state.diaria.metas.length) ? {
      metas: state.diaria.metas.map(m => ({nome:m.nome, meta:m.meta, feito:m.feito})),
      completa, xp: state.diaria.xp, c: state.diaria.c || Math.round(state.diaria.xp/10),
      marcar: completa
    } : null,
    vicios: state.vicios.map(v => ({id:v.id, nome:v.nome, peso:v.peso, recaiu:false})),
    resolvido: false
  };
}
const fechamentoPendente = () => !!(state.fechamento && !state.fechamento.resolvido);

function abrirFechamento(){
  const f = state.fechamento; if(!f) return;
  const d = new Date(f.dia + 'T00:00');
  const dataTxt = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
  const diariaOk = f.diaria ? f.diaria.marcar : true;
  const nHab = f.habitos.filter(h => h.marcar).length;
  const base = xpNecessario(state.hunter.nivel);
  const penal = f.diaria && !diariaOk ? Math.round(base * 0.15 * f.dias) : 0;

  overlay.className = 'overlay on';
  overlay.onclick = null;
  overlay.innerHTML = `<div class="ob">
    <div class="passo"><span>[ Relatório do dia ]</span><span class="num">${dataTxt}</span></div>
    <h4>${f.dias > 1 ? `${f.dias} dias se passaram desde a última vez.` : 'O dia virou.'}</h4>
    <div class="lbl" style="line-height:1.7;margin-bottom:16px">
      Isto é o que ficou registrado. Se você fez alguma coisa e esqueceu de marcar, marque agora —
      lançamento atrasado paga <b style="color:var(--gelo)">75%</b>. A penalidade só é aplicada depois que você confirmar.
    </div>

    ${f.diaria ? `
      <div class="lbl" style="margin-bottom:7px;color:var(--ciano)">Missão diária</div>
      <div class="panel ${diariaOk?'':'warn'}" style="margin-bottom:14px">
        ${f.diaria.metas.map(m => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;
          color:${m.feito>=m.meta?'var(--ok)':'var(--mute)'}">
          <span>${m.feito>=m.meta?'✓':'○'} ${esc(m.nome)}</span>
          <span class="num">${m.feito} / ${m.meta}</span></div>`).join('')}
        <button class="btn ${diariaOk?'solid':'ghost'} full" data-fc="diaria" style="margin-top:11px">
          ${diariaOk ? '✓ Cumpri a diária' : `Não cumpri · −${fmt(penal)} XP`}</button>
      </div>` : ''}

    ${f.habitos.length ? `
      <div class="lbl" style="margin-bottom:7px;color:var(--ciano)">Bons hábitos · ${nHab}/${f.habitos.length}</div>
      <div class="panel" style="margin-bottom:14px">
        ${f.habitos.map(h => `<div class="item" style="padding:5px 0">
          <button class="check ${h.marcar?'done':''}" data-fc="hab" data-i="${h.id}" aria-label="Marcar">✓</button>
          <div class="body"><strong style="font-size:14px">${esc(h.nome)}</strong>
            <div class="sub"><span>${h.feito ? 'marcado no dia' : (h.marcar ? 'lançado agora · 75%' : `sequência de ${h.seqAntes} dias em risco`)}</span></div>
          </div></div>`).join('')}
      </div>` : ''}

    ${f.vicios.length ? `
      <div class="lbl" style="margin-bottom:7px;color:var(--sombra)">Teve alguma recaída?</div>
      <div class="panel" style="margin-bottom:16px">
        ${f.vicios.map(v => `<div class="item" style="padding:5px 0">
          <button class="check ${v.recaiu?'done':''}" data-fc="vic" data-i="${v.id}" aria-label="Marcar"
            style="${v.recaiu?'background:var(--sombra);border-color:var(--sombra);color:#0a0512':''}">✓</button>
          <div class="body"><strong style="font-size:14px">${esc(v.nome)}</strong>
            <div class="sub"><span>${v.recaiu ? `recaída · ${PESOS[v.peso].n}` : 'sem recaída'}</span></div>
          </div></div>`).join('')}
        <div class="lbl" style="margin-top:8px;text-transform:none;letter-spacing:0">
          Só marque se aconteceu de verdade. Mentir aqui não engana o Sistema, engana você.
        </div>
      </div>` : ''}

    <button class="btn solid full" data-fc="ok">Confirmar relatório</button>
  </div>`;
  overlay.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => acaoFechamento(b.dataset.fc, b.dataset.i));
}

function acaoFechamento(acao, id){
  const f = state.fechamento; if(!f) return;
  const el = overlay.querySelector('.ob'); const y = el ? el.scrollTop : 0;
  if(acao === 'diaria'){ f.diaria.marcar = !f.diaria.marcar; ping(f.diaria.marcar?880:420,.07); }
  else if(acao === 'hab'){ const h = f.habitos.find(x => x.id === id); if(h){ h.marcar = !h.marcar; ping(h.marcar?760:400,.06); } }
  else if(acao === 'vic'){ const v = f.vicios.find(x => x.id === id); if(v){ v.recaiu = !v.recaiu; ping(v.recaiu?300:600,.08); } }
  else if(acao === 'ok'){ resolverFechamento(); return; }
  abrirFechamento();
  const novo = overlay.querySelector('.ob'); if(novo && y) novo.scrollTop = y;
}

function resolverFechamento(){
  const f = state.fechamento; if(!f) return;
  const atraso = 0.75;
  let xpTotal = 0, coTotal = 0;
  const linhas = [];

  /* hábitos lançados com atraso: pagam 75% e salvam a sequência */
  f.habitos.filter(h => h.marcar && !h.feito).forEach(hf => {
    const h = state.habitos.find(x => x.id === hf.id); if(!h) return;
    h.seq = hf.seqAntes + 1;
    h.melhor = Math.max(h.melhor || 0, h.seq);
    h.total = (h.total || 0) + 1;
    state.totais.melhorSeq = Math.max(state.totais.melhorSeq, h.seq);
    state.totais.habitos++;
    const bonus = 1 + bonusSeq(h.seq);
    const xp = Math.round(hf.xp * bonus * multXP() * atraso);
    const co = Math.round(hf.c * bonus * multCoin() * atraso);
    xpTotal += xp; coTotal += co;
    linhas.push(`${hf.nome} · +${fmt(xp)} XP`);
  });

  /* diária lançada com atraso */
  if(f.diaria && f.diaria.marcar && !f.diaria.completa){
    const xp = Math.round(f.diaria.xp * multXP() * atraso);
    const co = Math.round(f.diaria.c * multCoin() * atraso);
    xpTotal += xp; coTotal += co;
    state.totais.diariasOk++;
    evento('diarias', 1);
    linhas.push(`Missão diária · +${fmt(xp)} XP`);
  }

  if(xpTotal || coTotal){
    state.hunter.xp += xpTotal; state.hunter.coins += coTotal;
    state.totais.xpCarreira += xpTotal;
    registrar(`Lançamento atrasado de ${f.dia} · +${fmt(xpTotal)} XP · +${fmt(coTotal)} Coins`, 'ganho');
    ganharPericia(xpTotal * 0.5);
    subirNivel();
  }

  /* recaídas declaradas agora */
  f.vicios.filter(v => v.recaiu).forEach(vf => {
    const v = state.vicios.find(x => x.id === vf.id); if(!v) return;
    const base = xpNecessario(state.hunter.nivel), m = PESOS[v.peso].m;
    const p = perder(Math.round(base*m), Math.round(base*m/10), `Recaída declarada: ${v.nome}`);
    v.limpo = 0; v.recaidas++; state.totais.recaidas++;
    evento('recaida', 1);
    linhas.push(`Recaída em ${vf.nome} · −${fmt(p.xp)} XP`);
  });

  /* penalidade da diária, só agora e só se realmente não foi feita */
  const diariaFalhou = !!(f.diaria && !f.diaria.marcar);
  let pen = null;
  if(diariaFalhou){
    const base = xpNecessario(state.hunter.nivel);
    pen = perder(Math.round(base * 0.15 * f.dias), Math.round(base * 0.015 * f.dias), 'Missão diária não cumprida');
    state.diaria.penalidades++;
  }

  const perfeito = f.habitos.length > 0 && f.habitos.every(h => h.marcar);
  if(perfeito && f.dias === 1) state.totais.diasPerfeitos++;
  evento('dia', f.dias, {perfeito, diariaFalhou});

  f.resolvido = true;
  state.fechamento = null;
  fecharForm();

  const corpo = [
    linhas.length ? linhas.slice(0,5).join('\n') : 'Nada lançado com atraso.',
    diariaFalhou ? `\nPenalidade: −${fmt(pen.xp)} XP · −${fmt(pen.co)} Coins.` : '\nNenhuma penalidade hoje.'
  ].join('');
  notificar(diariaFalhou ? 'penalidade' : 'level',
    diariaFalhou ? 'Dia fechado com dívida' : 'Dia fechado',
    corpo);
  atualizar();
}

/* ==================== PORTAL SEMANAL ==================== */
const PORTAL_NOMES = ['Caverna Vermelha','Ruína Submersa','Torre Invertida','Floresta Silenciosa',
  'Mina Abandonada','Catedral Rachada','Deserto de Vidro','Fenda Azul','Necrópole Fria',
  'Jardim de Pedra','Ponte dos Ecos','Colmeia Negra','Salão dos Espelhos','Cratera Muda'];
const PORTAL_OBJ = {
  diarias:   n => `Concluir ${n} diárias`,
  habitos:   n => `Marcar ${n} bons hábitos`,
  missoes:   n => `Concluir ${n} ${n===1?'missão':'missões'}`,
  xp:        n => `Ganhar ${fmt(n)} XP`,
  semrecaida:n => `Ficar ${n} dias sem recaída`
};
const hashStr = s => { let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0; return Math.abs(h); };
const domingoDe = ds => { const d = new Date(ds+'T00:00'); d.setDate(d.getDate() - d.getDay());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function gerarPortal(){
  const semana = domingoDe(hoje()), h = hashStr(semana), nv = state.hunter.nivel;
  const rk = rankDe(nv), ri = RANKS.findIndex(r => r.r === rk.r);
  const pool = ['diarias','habitos','missoes','xp','semrecaida'];
  const escolhidos = [];
  for(let i = 0; escolhidos.length < 3 && i < 12; i++){
    const k = pool[(h + i*7) % pool.length];
    if(!escolhidos.includes(k)) escolhidos.push(k);
  }
  /* tudo calibrado em cima da renda semanal real do jogador, não do XP do nível:
     um portal precisa ser exigente, não impossível. */
  const rendaSem = ((state.diaria.ativa ? state.diaria.xp : 0)
                   + state.habitos.reduce((a,x) => a + x.xp, 0)) * 7 || 5000;
  const marcasPossiveis = Math.max(3, state.habitos.length * 7 - 2);
  const alvos = {
    diarias:   Math.min(7, 4 + Math.floor(ri/2)),
    habitos:   Math.min(marcasPossiveis, 8 + ri*3),
    missoes:   1 + Math.floor(ri/2),
    xp:        Math.round(rendaSem * (0.45 + ri*0.06) / 100) * 100,
    semrecaida:7
  };
  const fimSem = new Date(semana + 'T00:00'); fimSem.setDate(fimSem.getDate() + 7);
  const sobra = fimSem - new Date();
  const previa = sobra < 3.5 * 86400000;   // entrou com a semana já correndo
  state.portal = {
    semana, rank:rk.r, cor:rk.cor, previa,
    nome:PORTAL_NOMES[h % PORTAL_NOMES.length],
    objs: escolhidos.map(k => ({k, alvo:alvos[k], prog:0})),
    xp: Math.round(rendaSem * (0.8 + ri*0.25) / 50) * 50,
    c:  Math.round(rendaSem * (0.8 + ri*0.25) / 9 / 5) * 5,
    fechado:false
  };
  registrar(`Portal aberto: ${state.portal.nome} · Rank ${rk.r}${previa?' (prévia)':''}`, 'rank');
  if(previa){
    notificar('rank', 'Portal em andamento',
      `${state.portal.nome} · Rank ${rk.r}\nA semana já estava correndo quando você chegou.\nEste aqui não cobra nada se não for limpo — serve para você ver como funciona.\nO portal que vale abre no próximo domingo.`);
    return;
  }
  notificar('rank', 'Portal aberto',
    `${state.portal.nome} · Rank ${rk.r}\nUm portal semanal se abriu. Ele fecha sozinho no próximo domingo.\nRecompensa: ${fmt(state.portal.xp)} XP · ${fmt(state.portal.c)} Coins.\nSair sem limpar custa caro.`);
}
function checarPortal(){
  const p = state.portal;
  if(!p || p.fechado || !p.objs.every(o => o.prog >= o.alvo)) return;
  p.fechado = true;
  state.totais.portais = (state.totais.portais||0) + 1;
  if(p.rank === 'S' || p.rank === 'M') state.totais.portalS = (state.totais.portalS||0) + 1;
  ganhar(p.xp, p.c, `Portal limpo: ${p.nome}`);
  tentarDrop(.7, 3.5 + iRank(state.hunter.nivel) * 0.4, 3);
  if(Math.random() < .09) darConsumivel('tomo');
  if(Math.random() < .04) darConsumivel('livro');
  notificar('rank', 'Portal limpo',
    `${p.nome} foi fechado por dentro.\n+${fmt(p.xp)} XP · +${fmt(p.c)} Coins.\nPortais limpos: ${state.totais.portais}.`);
}
function virarSemana(){
  const semana = domingoDe(hoje());
  if(state.portal && state.portal.semana === semana) return;
  if(state.portal && !state.portal.fechado && !state.portal.previa){
    const perdido = state.portal;
    const pen = perder(Math.round(xpNecessario(state.hunter.nivel) * 0.20), 0, `Portal colapsou: ${perdido.nome}`);
    notificar('penalidade', 'Portal colapsado',
      `${perdido.nome} fechou com você do lado de fora.\n−${fmt(pen.xp)} XP.\nUm portal não limpo é uma dívida com o Sistema.`);
  }
  gerarPortal();
}

function checarFeitos(){
  if(!state.feitos) state.feitos = [];
  const novos = FEITOS.filter(f => !state.feitos.includes(f.id) && f.c());
  if(!novos.length) return;
  novos.forEach(f => state.feitos.push(f.id));
  const f = novos[0];
  registrar(`Feito desbloqueado: ${f.n}${novos.length>1?` (+${novos.length-1})`:''}`, 'rank');
  notificar('rank', 'Feito desbloqueado',
    `${f.n}\n${f.d}\nTítulo liberado: ${f.t}.${novos.length>1?`\n(+${novos.length-1} ${novos.length>2?'outros feitos':'outro feito'} no mesmo instante)`:''}`);
}

/* ---------- eventos que alimentam provação e portal ---------- */
function evento(k, v=1, extra={}){
  const p = state.prova;
  if(p){
    if(k === 'xp'      && p.tipo === 'xp')      p.prog += v;
    if(k === 'missoes' && p.tipo === 'missoes') p.prog += v;
    if(k === 'diarias' && p.tipo === 'diarias') p.prog += v;
    if(k === 'recaida' && p.tipo === 'semrecaida') quebrarProva('uma recaída foi registrada');
    if(k === 'dia' && state.prova){
      if(p.tipo === 'semrecaida') p.prog += v;
      if(p.tipo === 'perfeitos'){ extra.perfeito ? (p.prog += 1) : (p.prog > 0 && quebrarProva('um dia sem completar todos os hábitos')); }
      if(p.tipo === 'diarias' && extra.diariaFalhou && p.prog > 0) quebrarProva('a missão diária não foi cumprida');
    }
    if(state.prova && state.prova.tipo === 'sequencia') state.prova.prog = Math.max(0, ...state.habitos.map(h => h.seq));
    checarProva();
  }
  const pt = state.portal;
  if(pt && !pt.fechado){
    pt.objs.forEach(o => {
      if(o.k === k && o.k !== 'semrecaida') o.prog = Math.min(o.alvo, o.prog + v);
      if(o.k === 'semrecaida'){
        if(k === 'recaida') o.prog = 0;
        if(k === 'dia')     o.prog = Math.min(o.alvo, o.prog + v);
      }
    });
    checarPortal();
  }
}

/* ==================== O COFRE (passiva da Ganância) ====================
   No original a Ganância é imortal: nada que tiram dele fica tirado.
   Aqui a imortalidade tem preço em dinheiro — quanto maior o cofre parado,
   menos a punição encosta. Curva logarítmica: 1.000 moedas quase não fazem
   diferença, 1.000.000 deixam passar 1%. E o escudo é o próprio saldo, então
   gastar na loja enfraquece você. É por isso que ele nunca solta o que junta. */
const temCofre = () => CLS().some(c => c.arv === 'ganancia');
function escudoCofre(){
  if(!temCofre()) return {red:0, coins:0};
  const c = Math.max(0, state.hunter.coins);
  const red = Math.min(0.99, Math.log10(1 + c/1000) / Math.log10(1001) * 0.99);
  return {red, coins:c};
}

function juramentoDoLeao(){
  const s = forcaSolar(), f = s ? s.f : 0;
  const faixa = (s && s.pico) ? 'pico' : f >= 0.70 ? 'alto' : f >= 0.35 ? 'medio' : f > 0 ? 'baixo' : 'nulo';
  const linha = fala(JURAMENTO[faixa], 'jur-' + faixa);
  return linha.replace(/\{N\}/g, NOME_CAPS());
}

/* ==================== A VOZ DA QUARTA PAREDE ====================
   Ela nunca fala em primeira pessoa: o Sistema NARRA o que ela faz, entre colchetes,
   como se fosse legenda de história. Ela xinga, mas o asterisco entra sozinho —
   e ela reclama disso. Nenhuma fala se repete até o repertório inteiro acabar. */
const USADAS = () => state.pdUsadas || (state.pdUsadas = {});
function fala(pool, chave){
  const u = USADAS()[chave] || [];
  let livres = pool.map((_, i) => i).filter(i => !u.includes(i));
  if(!livres.length){ livres = pool.map((_, i) => i); USADAS()[chave] = []; }
  const i = livres[Math.floor(Math.random() * livres.length)];
  (USADAS()[chave] = USADAS()[chave] || []).push(i);
  return pool[i];
}

/* ==================== O LEITOR ====================
   Classe escondida atrás de uma segunda tranca, dentro do modo administrador.
   Não é forte: é quem já leu a história inteira. Não faz multiclasse — anexa
   caminhos alheios, empresta habilidades e toma perícias emprestadas por um dia.
   Paga por isso com o triplo de XP por nível. */
const SENHA_LEITOR = 'existenciavazia';
const temLeitor = () => CLS().some(c => c.arv === 'leitor');
const nivelLeitura = () => nivelPericia('leitor');
const nivelEscrita = () => nivelPericia('escrita');

/* --- caminhos copiados: infinitos, e cada um entra no grau escolhido --- */
const COPIAS = () => state.copias || (state.copias = []);
const rotasMinhas = () => new Set([...CLS().map(c => c.arv), ...COPIAS().map(id => CLASSES[id].arv)]);
const classesCopiadas = () => COPIAS().map(id => CLASSES[id]).filter(Boolean);
/* Ela come a história pelo começo. Só o primeiro degrau de cada rota entra;
   o resto sobe lendo — cada degrau custa histórias, não Coins. */
function podeAnexar(c){
  return temLeitor() && c.arv !== 'nenhuma' && c.arv !== 'leitor'
      && c.i === 0 && !rotasMinhas().has(c.arv);
}
/* quantas leituras cada degrau custa, subindo com a raridade do próximo */
const custoLeitura = prox => [0, 3, 5, 9, 14, 22, 34, 50][prox.r] || 10;
/* Requisitos de um caminho devorado: os mesmos da classe, com duas trocas —
   a perícia exigida é a Leitura dela, e entra o custo em histórias lidas. */
function reqDevorada(prox){
  const perNome = PERICIAS[prox.arv] ? PERICIAS[prox.arv][0] : 'Perícia';
  const base = requisitos(prox, .7).filter(x => x.n !== perNome);
  const perMin = Math.min(PER_MAX, Math.round(prox.r * 6.5));
  const escMin = Math.max(1, Math.round(perMin * 0.6));
  return [...base,
    {n:'Leitura', tem:nivelLeitura(), prec:perMin, ok:nivelLeitura() >= perMin},
    {n:'Escrita', tem:nivelEscrita(), prec:escMin, ok:nivelEscrita() >= escMin},
    {n:'Capítulos guardados', tem:lidasLivres(), prec:custoLeitura(prox), ok:lidasLivres() >= custoLeitura(prox)}];
}
const LIDAS = () => state.totais.leituras || 0;
const lidasGastas = () => state.lidasGastas || 0;
const lidasLivres = () => Math.max(0, LIDAS() - lidasGastas());
function anexarRota(id){
  const c = CLASSES[id];
  if(!podeAnexar(c)){ toast('Esta rota já é sua', 'bad'); return; }
  if(devorouEstaSemana()){
    fecharForm();
    notificar('penalidade', 'A Quarta Parede',
      `${narra('diz: "uma por semana. eu preciso digerir."')}\n\nEla já devorou uma história nesta semana.\nA próxima só no domingo.`);
    return;
  }
  state.devorouSemana = SEMANA_ATUAL();
  const ciume = Math.random() < chanceCiume(c.r);
  const veredito = fala(PD_VEREDITO[c.r] || PD_VEREDITO[1], 'ver-' + c.r);
  if(!(state.desc||[]).includes(id)) (state.desc = state.desc||[]).push(id);
  fecharForm();
  if(ciume){
    registrar(`A Quarta Parede devorou ${c.nome} e reteve os bônus`, 'sys');
    notificar('rank', 'Devorada',
      `«${c.nome}» · ${RARIDADES[c.r].n}\n\n${narra(veredito)}\n\n${narra(fala(PD_NEGA,'nega'))}\n\nA história foi lida. Os bônus ficaram com ela.`);
  } else {
    COPIAS().push(id);
    registrar(`A Quarta Parede devorou ${c.nome}`, 'rank');
    notificar('rank', 'Devorada',
      `«${c.nome}» · ${RARIDADES[c.r].n}\n\n${narra(veredito)}\n\nO caminho inteiro passou para o seu registro. Os bônus somam.`);
  }
  atualizar();
}
function soltarRota(id){
  const c = CLASSES[id];
  state.copias = COPIAS().filter(x => x !== id);
  registrar(`Caminho solto: ${c.nome}`, 'sys');
  toast('Caminho solto'); fecharForm(); atualizar();
}
function evoluirCopia(id){
  const c = CLASSES[id], prox = CLASSES[c.arv + ':' + (c.i + 1)];
  if(!prox){ toast('Fim da rota', 'bad'); return; }
  /* Mesmos requisitos da classe — só que a perícia cobrada é a DELA, não a da rota. */
  const req = reqDevorada(prox);
  const falta = req.filter(x => !x.ok);
  if(falta.length){
    notificar('penalidade', 'A Quarta Parede',
      `${narra('diz: "ainda não. leia mais, cresça mais, volta aqui."')}\n\nFalta para ${prox.nome}:\n` +
      falta.map(x => `· ${x.n}: ${fmt(x.tem)} de ${fmt(x.prec)}`).join('\n'));
    return;
  }
  const custo = custoLeitura(prox);
  if(lidasLivres() < custo){
    notificar('penalidade', 'A Quarta Parede',
      `${narra('diz: "leia mais. eu não subo com fome."')}\n\n${prox.nome} pede ${custo} leituras.\nVocê tem ${lidasLivres()} disponíveis.`);
    return;
  }
  state.lidasGastas = lidasGastas() + custo;
  registrar(`${custo} capítulos consumidos para subir ${prox.nome}`, 'sys');
  state.copias = COPIAS().map(x => x === id ? prox.id : x);
  if(!(state.desc||[]).includes(prox.id)) (state.desc = state.desc||[]).push(prox.id);
  const veredito = fala(PD_VEREDITO[prox.r] || PD_VEREDITO[1], 'ver-' + prox.r);
  /* às vezes ela gosta demais e incorpora em vez de dividir */
  if(Math.random() < chanceCiume(prox.r)){
    state.copias = COPIAS().filter(x => x !== prox.id);
    const ganho = 2 + prox.r;
    state.paredeForca = (state.paredeForca || 0) + ganho;
    ganharPericiaEm('leitor', 300 * prox.r);
    registrar(`A Quarta Parede incorporou ${prox.nome}`, 'sys');
    notificar('rank', 'Ela ficou com essa',
      `«${prox.nome}» · ${RARIDADES[prox.r].n}\n\n${narra(veredito)}\n\n${narra(fala(PD_INCORPORA,'inc'))}\n\nEla absorveu o caminho inteiro. Você não recebe os bônus — ela ficou ${ganho}% mais forte, e a perícia Leitura subiu junto.`);
  } else {
    registrar(`Caminho devorado evoluiu: ${c.nome} → ${prox.nome}`, 'rank');
    notificar('rank', 'Caminho evoluiu',
      `«${c.nome}» → «${prox.nome}»\n${custo} leituras consumidas\n\n${narra(veredito)}`);
  }
  atualizar();
}

/* --- perícias tomadas emprestadas: quatro por dia, ou uma fixa para sempre --- */
const PER_COPIA_DIA = 4;
const COPIAS_PER = () => state.perCopias || (state.perCopias = {});
function limparPericiasCopiadas(){
  const h = hoje(), o = COPIAS_PER();
  Object.keys(o).forEach(k => { if(!o[k].fixa && o[k].dia !== h) delete o[k]; });
}
const periciasCopiadasHoje = () => { limparPericiasCopiadas();
  return Object.values(COPIAS_PER()).filter(x => !x.fixa).length; };
const temPericiaCopiada = arv => { limparPericiasCopiadas(); return !!COPIAS_PER()[arv]; };
function copiarPericia(arv, fixar){
  limparPericiasCopiadas();
  if(!fixar && periciasCopiadasHoje() >= PER_COPIA_DIA){
    toast(`Só ${PER_COPIA_DIA} por dia`, 'bad'); return;
  }
  COPIAS_PER()[arv] = fixar ? {fixa:true} : {dia:hoje()};
  registrar(`Perícia ${fixar?'fixada':'emprestada'}: ${PERICIAS[arv][0]}`, 'rank');
  toast(`${PERICIAS[arv][0]} ${fixar?'fixada':'até o fim do dia'}`, 'good');
  fecharForm(); atualizar();
}

const PAREDE_FALAS = [

  'essa aí eu não gostei. tente outra.',
  'você usou demais essa semana. está ficando previsível.',
  'não estou com vontade. amanhã eu penso.',
  'já li como isso termina. passo.',
  'essa página está grudada. deixa pra lá.',
  'eu poderia. mas não vou.'
];
const PAREDE_OPINIOES = [
  'você está indo bem. não se acostume.',
  'gostei do capítulo de ontem.',
  'tem uma parte da sua história que você ainda não escreveu. eu vi.',
  'para de me olhar e vai fazer alguma coisa.',
  'estou de bom humor hoje. aproveita.',
  'eu não sirvo pra te dar razão. sirvo pra você continuar.'

const sorteioDia = (semente) => {
  let h = hashStr(hoje() + '|' + semente);
  return (h % 1000) / 1000;
};
const falaParede = () => PAREDE_FALAS[Math.floor(Math.random()*PAREDE_FALAS.length)];
/* quais habilidades a Parede recusa hoje — decidido uma vez, não a cada render */
function paredeRecusa(arv){
  if(!temLeitor()) return null;
  const disp = habilidadesDisponiveis().map(h => h.arv);
  if(disp.length <= 1) return null;                       // nunca tranca a última
  const bloqueadas = disp.filter(a => sorteioDia('bloq|' + a) < 0.32);
  if(bloqueadas.length >= disp.length) bloqueadas.pop();  // garante uma sobrando
  if(!bloqueadas.includes(arv)) return null;
  return PAREDE_RECUSAS[Math.floor(sorteioDia('fala|' + arv) * PAREDE_RECUSAS.length)];
}
const opiniaoParede = () => PAREDE_OPINIOES[Math.floor(sorteioDia('op') * PAREDE_OPINIOES.length)];
function filtroParede(){
  if(!temLeitor() || state.paredeDorme) return {corta:0, chance:0};
  const nv = nivelLeitura(), extra = (state.paredeForca || 0) / 100;
  return {corta: Math.min(0.96, 0.55 + nv*0.007 + extra*0.3),
          chance: Math.min(0.55, 0.10 + nv*0.007 + extra*0.2)};
}

/* habilidades ao alcance: as das suas classes e as dos caminhos anexados */
function habilidadesDisponiveis(){
  const vistos = new Set(), out = [];
  [...CLS(), ...classesCopiadas()].forEach(c => {
    const p = PODERES[c.arv];
    if(p && c.r >= (p.grau || 1) && !vistos.has(c.arv)){

  if(!state.poderDia || typeof state.poderDia === 'string') state.poderDia = {};
  if(state.poderDia[p.arv] === hoje()){ toast(`${p.n} já foi usado hoje`, 'bad'); return; }
  state.poderDia[p.arv] = hoje();

  const lista = state.buffs.filter(b => b.poder).map(b => '+'+b.v+'% '+NOME_BN[b.k]).join(' · ');
  const rotulo = p._ultimo ? `${p.n} · ${p._ultimo}` : p.n;

  if(temLeitor() && !state.paredeDorme){
    setTimeout(() => notificar('rank', 'A Quarta Parede', narra(fala(PD_ATIVA, 'ativa'))), 300);

function aberturaPoder(p){
  if(p.arv === 'orgulho'){
    const s = forcaSolar(), pct = s ? Math.round(s.f*100) : 0;
    const h = s ? s.hora : new Date().getHours();
    if(s && s.pico)   return 'Meio-dia exato. O sol está no ponto mais alto que vai chegar hoje.';
    if(pct >= 75)     return `Sol quase a pino, ${pct}% de carga. Falta pouco para o máximo.`;
    if(pct >= 45)     return `Sol firme no céu, ${pct}% de carga. Dá para trabalhar com isso.`;
    if(pct >= 20)     return `${h < 12 ? 'Manhã ainda subindo' : 'Tarde já caindo'}, ${pct}% de carga. O efeito vem fraco.`;
    if(h < 5 || h >= 20) return `Sol nenhum no céu. ${pct}% de carga — isso aqui é teimosia, não poder.`;
    return `Luz fraca, ${pct}% de carga. Você invocou fora da hora e o sol sabe disso.`;
  }
  if(p.arv === 'orgulho')    return juramentoDoLeao();
  if(p.arv === 'ceifador')   return 'A foice desce uma vez. O que estava cobrando some junto com o resto.';
  if(p.arv === 'libertador') return 'A realidade abriu uma exceção e ninguém foi conferir.';
  if(p.arv === 'barreira')   return 'A barreira sobe. Do lado de fora o mundo continua; aqui dentro, não.';
  if(p.arv === 'ira')        return 'Tudo que você engoliu volta de uma vez.';
  if(p.arv === 'ganancia')   return 'O cofre abriu sozinho e ninguém vai contar de novo.';
  if(p.arv === 'preguica')   return 'Você não fez nada hoje. É exatamente por isso que funciona.';
  if(p.arv === 'gula')       return 'O prato sumiu. A conta seguinte quem paga é o mundo.';
  if(p.arv === 'inveja')     return 'O que é dos outros brilha mais, e por um instante é seu.';
  if(p.arv === 'luxuria')    return 'Ninguém tem por que dizer não agora.';
  return 'O Sistema abriu uma exceção.';
}

    return 'Passado o tempo, o efeito acaba e o céu segue como estava.';

  if(p.arv === 'ceifador')   return 'Passada a ceifa, o campo volta a encher. É assim que sempre foi.';
  if(p.arv === 'barreira')   return 'Quando ela cair, o que estava esperando ainda vai estar lá.';

  return 'Quando o tempo fechar, tudo volta ao normal.';
}
